const T = {
"en":{"title":"Privacy Policy","updated":"Last updated: September 2026","footer":"Privacy Policy","s":[["What data we collect","None. SSH2VPN does not collect, store, or transmit any personal data. There are no accounts and no analytics of our own. The free version shows third-party ads — see Advertising below."],["Where your data lives","Everything stays on your device. Server credentials (passwords, keys) are stored only in the iOS Keychain and never leave it. Connection settings and the free-time ledger are stored locally on your device."],["Your VPN server","SSH2VPN routes traffic through a server you provide yourself (your own VPS). We do not operate any servers, do not see your traffic, and have no access to your VPN connection or its logs."],["Third parties","The app contacts only the servers you configure. To show a server's location on the map, the public hostname or IP may be sent to a public geo-lookup service (ipwhois.app or ip-api.com). This is the only external request, and it contains no information about you or your browsing."],["Advertising","The free version shows ads from Google AdMob. AdMob may collect device identifiers (including the advertising identifier, if you allow tracking), information about the ads you see, and crash and performance data — to show and measure ads and prevent fraud. Details: <a href=\"https://policies.google.com/privacy\">Google Privacy Policy</a>. Buying the Unlimited upgrade removes ads and stops this collection. The tracking permission prompt asks for your consent; you can change it anytime in iOS Settings → Privacy & Security → Tracking."],["Purchases","The optional Unlimited upgrade is processed entirely by Apple's App Store. We never see your payment details, name, or Apple ID. Purchase state is handled by StoreKit on your device."],["Children","The app is not directed at children under 13 and has no accounts or content of its own; the Advertising section above applies equally to all users."],["Changes","If this policy ever changes, the updated version will ship inside the app."],["Contact","Questions? Contact us from the App Store product page."]]},
"ru":{"title":"Политика конфиденциальности","updated":"Обновлено: сентябрь 2026","footer":"Политика конфиденциальности","s":[["Какие данные мы собираем","Никаких. SSH2VPN не собирает, не хранит и не передаёт персональные данные. В приложении нет аккаунтов и собственной аналитики. Бесплатная версия показывает стороннюю рекламу — см. раздел «Реклама» ниже."],["Где хранятся ваши данные","Всё остаётся на вашем устройстве. Пароли и ключи сервера хранятся только в связке ключей iOS и никогда не покидают её. Настройки подключения и счётчик бесплатного времени хранятся локально на устройстве."],["Ваш VPN-сервер","SSH2VPN направляет трафик через сервер, который вы предоставляете сами (ваш собственный VPS). Мы не управляем серверами, не видим ваш трафик и не имеем доступа к вашему VPN-подключению и его журналам."],["Сторонние сервисы","Приложение обращается только к серверам, которые вы настроили. Чтобы показать положение сервера на карте, публичное имя или IP может быть отправлено в публичный сервис геолокации (ipwhois.app или ip-api.com). Это единственный внешний запрос, и он не содержит никаких данных о вас и ваших действиях в сети."],["Реклама","Бесплатная версия показывает рекламу Google AdMob. AdMob может собирать идентификаторы устройства (включая рекламный идентификатор, если вы разрешили отслеживание), сведения о показанной рекламе, данные о сбоях и производительности — для показа и измерения рекламы и борьбы с мошенничеством. Подробности: <a href=\"https://policies.google.com/privacy\">Политика конфиденциальности Google</a>. Покупка «Безлимита» убирает рекламу и прекращает этот сбор. Запрос разрешения на отслеживание спрашивает ваше согласие; изменить его можно в любое время в Настройки iOS → Конфиденциальность и безопасность → Отслеживание."],["Покупки","Необязательное расширение «Безлимит» обрабатывается полностью Магазином приложений Apple. Мы не видим ваши платёжные данные, имя и Apple ID. Состояние покупки обрабатывается StoreKit на вашем устройстве."],["Дети","Приложение не предназначено для детей до 13 лет, в нём нет аккаунтов и собственного контента; раздел «Реклама» выше в равной мере относится ко всем пользователям."],["Изменения","Если политика изменится, обновлённая версия появится внутри приложения."],["Связь","Вопросы? Свяжитесь с нами со страницы приложения в App Store."]]},
"es":{"title":"Política de Privacidad","updated":"Última actualización: septiembre de 2026","footer":"Política de Privacidad","s":[["Qué datos recopilamos","Ninguno. SSH2VPN no recopila, almacena ni transmite datos personales. No hay cuentas ni analítica propia. La versión gratuita muestra anuncios de terceros — ver Publicidad más abajo."],["Dónde viven tus datos","Todo permanece en tu dispositivo. Las credenciales del servidor (contraseñas, claves) se guardan solo en el llavero de iOS y nunca salen de él. Los ajustes y el contador de tiempo gratuito se almacenan localmente."],["Tu servidor VPN","SSH2VPN dirige el tráfico a través de un servidor que tú mismo proporcionas (tu propio VPS). No operamos servidores, no vemos tu tráfico ni tenemos acceso a tu conexión VPN o sus registros."],["Terceros","La app solo contacta los servidores que configuras. Para mostrar la ubicación del servidor en el mapa, el nombre público o la IP puede enviarse a un servicio público de geolocalización (ipwhois.app o ip-api.com). Es la única petición externa y no contiene información sobre ti ni tu navegación."],["Publicidad","La versión gratuita muestra anuncios de Google AdMob. AdMob puede recopilar identificadores del dispositivo (incluido el identificador publicitario, si permites el seguimiento), información sobre los anuncios que ves y datos de fallos y rendimiento — para mostrar y medir anuncios y prevenir el fraude. Detalles: <a href=\"https://policies.google.com/privacy\">Política de Privacidad de Google</a>. Comprar la mejora Ilimitado elimina los anuncios y detiene esta recopilación. El aviso de permiso de seguimiento pide tu consentimiento; puedes cambiarlo cuando quieras en Ajustes de iOS → Privacidad y seguridad → Seguimiento."],["Compras","La mejora opcional Ilimitado la procesa íntegramente el App Store de Apple. Nunca vemos tus datos de pago, nombre o Apple ID. El estado de la compra lo gestiona StoreKit en tu dispositivo."],["Niños","La app no está dirigida a menores de 13 años y no tiene cuentas ni contenido propio; la sección Publicidad anterior se aplica por igual a todos los usuarios."],["Cambios","Si esta política cambia, la versión actualizada se incluirá en la app."],["Contacto","¿Preguntas? Contáctanos desde la página del producto en App Store."]]},
"de":{"title":"Datenschutzerklärung","updated":"Zuletzt aktualisiert: September 2026","footer":"Datenschutzerklärung","s":[["Welche Daten wir erheben","Keine. SSH2VPN erhebt, speichert oder übermittelt keine personenbezogenen Daten. Es gibt keine Konten und keine eigene Analyse. Die Gratis-Version zeigt Werbung von Dritten — siehe Werbung unten."],["Wo deine Daten leben","Alles bleibt auf deinem Gerät. Server-Zugangsdaten (Passwörter, Schlüssel) liegen nur im iOS-Schlüsselbund und verlassen ihn nie. Einstellungen und das Gratis-Zeit-Konto werden lokal gespeichert."],["Dein VPN-Server","SSH2VPN leitet den Traffic über einen Server, den du selbst bereitstellst (dein eigener VPS). Wir betreiben keine Server, sehen deinen Traffic nicht und haben keinen Zugriff auf deine VPN-Verbindung oder deren Protokolle."],["Dritte","Die App kontaktiert nur die Server, die du konfigurierst. Um den Server auf der Karte zu zeigen, kann der öffentliche Name oder die IP an einen öffentlichen Geo-Dienst (ipwhois.app oder ip-api.com) gesendet werden. Das ist die einzige externe Anfrage und enthält nichts über dich."],["Werbung","Die Gratis-Version zeigt Werbung von Google AdMob. AdMob kann Gerätekennungen (einschließlich der Werbe-ID, wenn du Tracking erlaubst), Infos zu gesehenen Anzeigen sowie Absturz- und Leistungsdaten erheben — um Werbung zu zeigen und zu messen und Betrug zu verhindern. Details: <a href=\"https://policies.google.com/privacy\">Datenschutzerklärung von Google</a>. Das Upgrade Unbegrenzt entfernt die Werbung und stoppt diese Erhebung. Die Tracking-Abfrage bittet um deine Einwilligung; ändern kannst du sie jederzeit unter iOS-Einstellungen → Datenschutz & Sicherheit → Tracking."],["Käufe","Das optionale Upgrade Unbegrenzt wird vollständig von Apples App Store abgewickelt. Wir sehen deine Zahlungsdaten, deinen Namen oder deine Apple-ID nie. Der Kaufstatus wird von StoreKit auf deinem Gerät verwaltet."],["Kinder","Die App richtet sich nicht an Kinder unter 13 und hat keine Konten oder eigenen Inhalte; der Abschnitt Werbung oben gilt gleichermaßen für alle Nutzer."],["Änderungen","Ändert sich diese Richtlinie, erscheint die aktualisierte Version in der App."],["Kontakt","Fragen? Kontaktiere uns über die Produktseite im App Store."]]},
"fr":{"title":"Politique de Confidentialité","updated":"Dernière mise à jour : septembre 2026","footer":"Politique de Confidentialité","s":[["Quelles données nous collectons","Aucune. SSH2VPN ne collecte, ne stocke ni ne transmet aucune donnée personnelle. Pas de comptes ni d'analytique maison. La version gratuite affiche des pubs de tiers — voir Publicité ci-dessous."],["Où vivent vos données","Tout reste sur votre appareil. Les identifiants du serveur (mots de passe, clés) sont stockés uniquement dans le trousseau iOS et n'en sortent jamais. Les réglages et le compteur de temps gratuit sont stockés localement."],["Votre serveur VPN","SSH2VPN achemine le trafic via un serveur que vous fournissez vous-même (votre propre VPS). Nous n'exploitons aucun serveur, ne voyons pas votre trafic et n'avons accès ni à votre connexion VPN ni à ses journaux."],["Tiers","L'app ne contacte que les serveurs que vous configurez. Pour afficher la position du serveur sur la carte, le nom public ou l'IP peut être envoyé à un service public de géolocalisation (ipwhois.app ou ip-api.com). C'est la seule requête externe, sans aucune donnée sur vous."],["Publicité","La version gratuite affiche des pubs Google AdMob. AdMob peut collecter des identifiants d'appareil (dont l'identifiant publicitaire, si vous autorisez le suivi), des infos sur les pubs vues et des données de plantage et de performance — pour diffuser et mesurer les pubs et prévenir la fraude. Détails : <a href=\"https://policies.google.com/privacy\">Règles de confidentialité Google</a>. L'upgrade Illimité supprime les pubs et stoppe cette collecte. L'invite d'autorisation de suivi demande votre consentement ; modifiable à tout moment dans Réglages iOS → Confidentialité et sécurité → Suivi."],["Achats","L'upgrade optionnelle Illimité est traitée entièrement par l'App Store d'Apple. Nous ne voyons jamais vos données de paiement, votre nom ou votre identifiant Apple. L'état de l'achat est géré par StoreKit sur votre appareil."],["Enfants","L'app ne s'adresse pas aux enfants de moins de 13 ans et n'a ni comptes ni contenu propre ; la section Publicité ci-dessus s'applique également à tous les utilisateurs."],["Changements","Si cette politique change, la version mise à jour sera intégrée à l'app."],["Contact","Des questions ? Contactez-nous depuis la page produit de l'App Store."]]},
"it":{"title":"Informativa sulla Privacy","updated":"Ultimo aggiornamento: settembre 2026","footer":"Informativa sulla Privacy","s":[["Quali dati raccogliamo","Nessuno. SSH2VPN non raccoglie, archivia né trasmette dati personali. Nessun account e nessuna analitica propria. La versione gratuita mostra annunci di terzi — vedi Pubblicità qui sotto."],["Dove vivono i tuoi dati","Tutto resta sul dispositivo. Le credenziali del server (password, chiavi) stanno solo nel portachiavi iOS e non lo lasciano mai. Impostazioni e contatore del tempo gratuito sono salvati in locale."],["Il tuo server VPN","SSH2VPN instrada il traffico tramite un server che fornisci tu (il tuo VPS). Non gestiamo server, non vediamo il tuo traffico e non abbiamo accesso alla connessione VPN o ai suoi log."],["Terze parti","L'app contatta solo i server che configuri. Per mostrare la posizione del server sulla mappa, il nome pubblico o l'IP può essere inviato a un servizio pubblico di geolocalizzazione (ipwhois.app o ip-api.com). È l'unica richiesta esterna e non contiene dati su di te."],["Pubblicità","La versione gratuita mostra annunci di Google AdMob. AdMob può raccogliere identificatori del dispositivo (incluso l'identificativo pubblicitario, se consenti il tracciamento), info sugli annunci visti e dati su arresti anomali e prestazioni — per mostrare e misurare gli annunci e prevenire le frodi. Dettagli: <a href=\"https://policies.google.com/privacy\">Norme sulla privacy di Google</a>. L'upgrade Illimitato rimuove gli annunci e ferma questa raccolta. La richiesta di consenso al tracciamento chiede il tuo permesso; modificabile in qualsiasi momento in Impostazioni iOS → Privacy e sicurezza → Tracciamento."],["Acquisti","Il miglioramento opzionale Illimitato è gestito interamente dall'App Store di Apple. Non vediamo mai i tuoi dati di pagamento, nome o Apple ID. Lo stato dell'acquisto è gestito da StoreKit sul dispositivo."],["Bambini","L'app non è rivolta ai minori di 13 anni e non ha account né contenuti propri; la sezione Pubblicità sopra vale allo stesso modo per tutti gli utenti."],["Modifiche","Se questa informativa cambierà, la versione aggiornata sarà inclusa nell'app."],["Contatti","Domande? Contattaci dalla pagina prodotto sull'App Store."]]},
"pt":{"title":"Política de Privacidade","updated":"Última atualização: setembro de 2026","footer":"Política de Privacidade","s":[["Quais dados coletamos","Nenhum. O SSH2VPN não coleta, armazena nem transmite dados pessoais. Não há contas nem análise própria. A versão grátis exibe anúncios de terceiros — ver Publicidade abaixo."],["Onde vivem seus dados","Tudo fica no seu dispositivo. As credenciais do servidor (senhas, chaves) ficam apenas no chaveiro do iOS e nunca saem dele. Ajustes e o contador de tempo grátis ficam armazenados localmente."],["Seu servidor VPN","O SSH2VPN roteia o tráfego por um servidor que você mesmo fornece (seu próprio VPS). Não operamos servidores, não vemos seu tráfego e não temos acesso à sua conexão VPN ou aos registros dela."],["Terceiros","O app contata apenas os servidores que você configura. Para mostrar a posição do servidor no mapa, o nome público ou o IP pode ser enviado a um serviço público de geolocalização (ipwhois.app ou ip-api.com). É a única requisição externa e não contém nada sobre você."],["Publicidade","A versão grátis exibe anúncios do Google AdMob. O AdMob pode coletar identificadores do dispositivo (incluindo o identificador de anúncios, se você permitir o rastreamento), informações sobre os anúncios vistos e dados de falhas e desempenho — para exibir e medir anúncios e prevenir fraudes. Detalhes: <a href=\"https://policies.google.com/privacy\">Política de Privacidade do Google</a>. Comprar o upgrade Ilimitado remove os anúncios e interrompe essa coleta. O aviso de permissão de rastreamento pede seu consentimento; pode ser alterado a qualquer momento em Ajustes do iOS → Privacidade e Segurança → Rastreamento."],["Compras","O upgrade opcional Ilimitado é processado inteiramente pela App Store da Apple. Nunca vemos seus dados de pagamento, nome ou Apple ID. O estado da compra é gerenciado pelo StoreKit no seu dispositivo."],["Crianças","O app não é direcionado a menores de 13 anos e não tem contas nem conteúdo próprio; a seção Publicidade acima vale igualmente para todos os usuários."],["Alterações","Se esta política mudar, a versão atualizada virá dentro do app."],["Contato","Dúvidas? Fale conosco pela página do produto na App Store."]]},
"ja":{"title":"プライバシーポリシー","updated":"最終更新：2026年9月","footer":"プライバシーポリシー","s":[["収集するデータ","なし。SSH2VPNは個人データを収集・保存・送信しません。アカウントや自社のアナリティクスはありません。無料版には第三者の広告が表示されます — 下の「広告」を参照。"],["データの保存場所","すべて端末内に留まります。サーバーの認証情報（パスワード、鍵）はiOSのキーチェーンのみに保存され、外部に出ることはありません。接続設定と無料時間のカウンターも端末内に保存されます。"],["あなたのVPNサーバー","SSH2VPNは、あなた自身が用意したサーバー（自分のVPS）経由でトラフィックを流します。当社はサーバーを運営せず、トラフィックを見ることも、VPN接続やそのログにアクセスすることもできません。"],["第三者","アプリが通信するのは、あなたが設定したサーバーだけです。サーバーの場所を地図に表示するため、公開ホスト名やIPを公開ジオサービス（ipwhois.app または ip-api.com）に送ることがあります。これが唯一の外部リクエストで、あなたに関する情報は含まれません。"],["広告","無料版にはGoogle AdMobの広告が表示されます。AdMobは、デバイス識別子（トラッキングを許可した場合は広告識別子を含む）、表示広告の情報、クラッシュやパフォーマンスデータを収集する場合があります — 広告の表示・測定や不正防止のためです。詳細：<a href=\"https://policies.google.com/privacy\">Googleプライバシーポリシー</a>。「無制限」アップグレードの購入で広告がなくなり、この収集も止まります。トラッキング許可の確認は同意を求めるもので、iOS設定 → プライバシーとセキュリティ → トラッキングからいつでも変更できます。"],["購入","オプションの「無制限」アップグレードはAppleのApp Storeが完全に処理します。お支払い情報、お名前、Apple IDは一切見えません。購入状態は端末上のStoreKitが管理します。"],["子供","本アプリは13歳未満の子供を対象としておらず、アカウントや自社コンテンツはありません。上記の「広告」はすべてのユーザーに等しく適用されます。"],["変更","本ポリシーが変わる場合は、更新版がアプリ内に同梱されます。"],["お問い合わせ","ご質問はApp Storeの商品ページからご連絡ください。"]]},
"zh":{"title":"隐私政策","updated":"最后更新：2026年9月","footer":"隐私政策","s":[["我们收集哪些数据","不收集任何数据。SSH2VPN 不收集、存储或传输任何个人数据。应用内没有账户，也没有自有分析。免费版会展示第三方广告 — 见下文「广告」。"],["数据存在哪里","一切都保存在您的设备上。服务器凭据（密码、密钥）仅存储在 iOS 钥匙串中，绝不会离开设备。连接设置和免费时长计数也仅本地存储。"],["您的 VPN 服务器","SSH2VPN 通过您自行提供的服务器（您自己的 VPS）路由流量。我们不运营任何服务器，看不到您的流量，也无法访问您的 VPN 连接或其日志。"],["第三方","应用只与您配置的服务器通信。为了在地图上显示服务器位置，可能会将公开主机名或 IP 发送到公共地理查询服务（ipwhois.app 或 ip-api.com）。这是唯一的外部请求，且不包含任何关于您或您浏览活动的信息。"],["广告","免费版展示 Google AdMob 广告。AdMob 可能收集设备标识符（若您允许跟踪，包括广告标识符）、所展示广告的信息以及崩溃和性能数据 — 用于展示和衡量广告并防范欺诈。详情：<a href=\"https://policies.google.com/privacy\">Google 隐私政策</a>。购买「不限量」升级可移除广告并停止此类收集。跟踪权限弹窗用于征求您的同意，可随时在 iOS 设置 → 隐私与安全 → 跟踪中更改。"],["购买","可选的「不限量」升级完全由 Apple 的 App Store 处理。我们永远看不到您的支付信息、姓名或 Apple ID。购买状态由设备上的 StoreKit 管理。"],["儿童","本应用不面向 13 岁以下儿童，没有账户和自有内容；上文「广告」同样适用于所有用户。"],["变更","若本政策发生变更，更新版本将随应用内附送。"],["联系方式","有疑问？请通过 App Store 产品页与我们联系。"]]},
"ko":{"title":"개인정보 처리방침","updated":"마지막 업데이트: 2026년 9월","footer":"개인정보 처리방침","s":[["어떤 데이터를 수집하나요","없습니다. SSH2VPN은 개인 데이터를 수집·저장·전송하지 않습니다. 계정이나 자체 분석은 없습니다. 무료 버전에는 제3자 광고가 표시됩니다 — 아래 '광고'를 참조하세요."],["데이터가 저장되는 곳","모두 기기에 남습니다. 서버 자격 증명(비밀번호, 키)은 iOS 키체인에만 저장되고 절대 나가지 않습니다. 연결 설정과 무료 시간 카운터도 기기에 로컬로 저장됩니다."],["사용자의 VPN 서버","SSH2VPN은 사용자가 직접 제공하는 서버(자신의 VPS)를 통해 트래픽을 라우팅합니다. 우리는 서버를 운영하지 않고, 트래픽을 볼 수 없으며, VPN 연결이나 그 로그에 접근할 수 없습니다."],["제3자","앱은 사용자가 설정한 서버에만 연결합니다. 지도에 서버 위치를 표시하기 위해 공개 호스트명이나 IP를 공개 지오 서비스(ipwhois.app 또는 ip-api.com)로 보낼 수 있습니다. 이것이 유일한 외부 요청이며 사용자에 대한 정보는 포함되지 않습니다."],["광고","무료 버전에는 Google AdMob 광고가 표시됩니다. AdMob은 기기 식별자(추적을 허용한 경우 광고 식별자 포함), 본 광고에 대한 정보, 충돌 및 성능 데이터를 수집할 수 있습니다 — 광고 표시·측정 및 사기 방지 목적입니다. 자세히: <a href=\"https://policies.google.com/privacy\">Google 개인정보처리방침</a>. '무제한' 업그레이드를 구매하면 광고가 제거되고 이 수집이 중단됩니다. 추적 권한 요청은 동의를 구하는 것으로, iOS 설정 → 개인정보 보호 및 보안 → 추적에서 언제든 변경할 수 있습니다."],["구매","선택적 '무제한' 업그레이드는 Apple의 App Store가 완전히 처리합니다. 결제 정보, 이름, Apple ID는 절대 보지 못합니다. 구매 상태는 기기의 StoreKit이 관리합니다."],["아동","이 앱은 13세 미만 아동을 대상으로 하지 않으며, 계정이나 자체 콘텐츠가 없습니다. 위의 '광고' 섹션은 모든 사용자에게 동일하게 적용됩니다."],["변경","이 방침이 변경되면 업데이트된 버전이 앱 안에 포함되어 배포됩니다."],["연락","궁금한 점은 App Store 제품 페이지에서 문의하세요."]]},
"ar":{"title":"سياسة الخصوصية","updated":"آخر تحديث: سبتمبر 2026","footer":"سياسة الخصوصية","s":[["البيانات التي نجمعها","لا شيء. لا يجمع SSH2VPN أي بيانات شخصية ولا يخزنها ولا يرسلها. لا حسابات ولا تحليلات خاصة بنا. تعرض النسخة المجانية إعلانات أطراف ثالثة — انظر الإعلانات أدناه."],["أين تُخزَّن بياناتك","كل شيء يبقى على جهازك. بيانات اعتماد الخادم (كلمات المرور والمفاتيح) تُخزَّن في سلسلة مفاتيح iOS فقط ولا تغادرها أبدًا. إعدادات الاتصال وعداد الوقت المجاني مخزنة محليًا على الجهاز."],["خادم VPN الخاص بك","يمرر SSH2VPN حركة المرور عبر خادم توفره أنت بنفسك (خادم VPS الخاص بك). لا نشغّل أي خوادم ولا نرى حركة مرورك ولا نملك وصولًا إلى اتصال VPN أو سجلاته."],["الأطراف الثالثة","يتواصل التطبيق فقط مع الخوادم التي تهيئها. لعرض موقع الخادم على الخريطة قد يُرسل اسم المضيف العام أو عنوان IP إلى خدمة تحديد موقع عامة (ipwhois.app أو ip-api.com). هذا هو الطلب الخارجي الوحيد ولا يحتوي على أي معلومات عنك."],["الإعلانات","تعرض النسخة المجانية إعلانات Google AdMob. قد يجمع AdMob معرفات الجهاز (بما فيها المعرف الإعلاني إذا سمحت بالتتبع) ومعلومات عن الإعلانات التي تشاهدها وبيانات الأعطال والأداء — لعرض الإعلانات وقياسها ومنع الاحتيال. التفاصيل: <a href=\"https://policies.google.com/privacy\">سياسة خصوصية Google</a>. شراء ترقية «غير المحدود» يزيل الإعلانات ويوقف هذا الجمع. يطلب إذن التتبع موافقتك؛ ويمكن تغييره في أي وقت من إعدادات iOS → الخصوصية والأمان → التتبع."],["المشتريات","تُعالج ترقية «غير المحدود» الاختيارية بالكامل عبر App Store من Apple. لا نرى أبدًا بيانات الدفع أو اسمك أو معرّف Apple. تُدار حالة الشراء عبر StoreKit على جهازك."],["الأطفال","التطبيق ليس موجهًا للأطفال دون 13 عامًا وليست له حسابات ولا محتوى خاص؛ وينطبق قسم الإعلانات أعلاه على جميع المستخدمين بالتساوي."],["التغييرات","إذا تغيرت هذه السياسة، ستأتي النسخة المحدثة داخل التطبيق."],["التواصل","أسئلة؟ تواصل معنا من صفحة المنتج في App Store."]]},
"hi":{"title":"गोपनीयता नीति","updated":"अंतिम अपडेट: सितंबर 2026","footer":"गोपनीयता नीति","s":[["हम कौन सा डेटा एकत्र करते हैं","कोई नहीं। SSH2VPN कोई व्यक्तिगत डेटा एकत्र, संग्रहीत या संचारित नहीं करता। ऐप में कोई खाते या अपना विश्लेषण नहीं हैं। मुफ़्त संस्करण तृतीय-पक्ष विज्ञापन दिखाता है — नीचे 'विज्ञापन' देखें।"],["आपका डेटा कहाँ रहता है","सब कुछ आपके डिवाइस पर रहता है। सर्वर क्रेडेंशियल (पासवर्ड, कुंजियाँ) केवल iOS कीचेन में संग्रहीत होते हैं और कभी बाहर नहीं जाते। कनेक्शन सेटिंग्स और मुफ़्त समय का काउंटर स्थानीय रूप से संग्रहीत हैं।"],["आपका VPN सर्वर","SSH2VPN ट्रैफ़िक को उस सर्वर से गुज़ारता है जो आप स्वयं देते हैं (आपका अपना VPS)। हम कोई सर्वर नहीं चलाते, आपका ट्रैफ़िक नहीं देखते, और न ही आपके VPN कनेक्शन या उसके लॉग तक पहुँच रखते हैं।"],["तृतीय पक्ष","ऐप केवल उन सर्वरों से संपर्क करता है जिन्हें आप सेट करते हैं। मैप पर सर्वर की स्थिति दिखाने के लिए सार्वजनिक होस्टनेम या IP को सार्वजनिक जियो सेवा (ipwhois.app या ip-api.com) को भेजा जा सकता है। यही एकमात्र बाहरी अनुरोध है और इसमें आपके बारे में कुछ भी नहीं होता।"],["विज्ञापन","मुफ़्त संस्करण Google AdMob के विज्ञापन दिखाता है। AdMob डिवाइस पहचानकर्ता (यदि आप ट्रैकिंग की अनुमति देते हैं तो विज्ञापन पहचानकर्ता सहित), देखे गए विज्ञापनों की जानकारी, और क्रैश व प्रदर्शन डेटा एकत्र कर सकता है — विज्ञापन दिखाने-मापने और धोखाधड़ी रोकने के लिए। विवरण: <a href=\"https://policies.google.com/privacy\">Google गोपनीयता नीति</a>। 'असीमित' अपग्रेड खरीदने से विज्ञापन हट जाते हैं और यह संग्रह रुक जाता है। ट्रैकिंग अनुमति अनुरोध आपकी सहमति माँगता है; इसे कभी भी iOS सेटिंग्स → गोपनीयता व सुरक्षा → ट्रैकिंग में बदला जा सकता है।"],["खरीद","वैकल्पिक 'असीमित' अपग्रेड पूरी तरह Apple के App Store द्वारा संसाधित होता है। हम आपके भुगतान विवरण, नाम या Apple ID कभी नहीं देखते। खरीद की स्थिति आपके डिवाइस पर StoreKit द्वारा प्रबंधित होती है।"],["बच्चे","यह ऐप 13 वर्ष से कम आयु के बच्चों के लिए नहीं है, इसमें कोई खाते या अपनी सामग्री नहीं है; ऊपर वाला 'विज्ञापन' अनुभाग सभी उपयोगकर्ताओं पर समान रूप से लागू होता है।"],["परिवर्तन","अगर यह नीति बदलती है, तो अपडेट संस्करण ऐप के अंदर आ जाएगा।"],["संपर्क","प्रश्न? App Store उत्पाद पेज से हमसे संपर्क करें।"]]},
"th":{"title":"นโยบายความเป็นส่วนตัว","updated":"อัปเดตล่าสุด: กันยายน 2026","footer":"นโยบายความเป็นส่วนตัว","s":[["เราเก็บข้อมูลอะไรบ้าง","ไม่มีเลย SSH2VPN ไม่เก็บ ไม่จัดเก็บ และไม่ส่งข้อมูลส่วนบุคคลใดๆ ไม่มีบัญชีและไม่มีการวิเคราะห์ของเราเอง เวอร์ชันฟรีแสดงโฆษณาของบุคคลที่สาม — ดูหัวข้อโฆษณาด้านล่าง"],["ข้อมูลของคุณอยู่ที่ไหน","ทุกอย่างอยู่บนอุปกรณ์ของคุณ ข้อมูลเข้าสู่ระบบเซิร์ฟเวอร์ (รหัสผ่าน คีย์) เก็บใน Keychain ของ iOS เท่านั้นและไม่เคยออกจากอุปกรณ์ การตั้งค่าการเชื่อมต่อและตัวนับเวลาฟรีเก็บไว้ในเครื่อง"],["เซิร์ฟเวอร์ VPN ของคุณ","SSH2VPN ส่งทราฟฟิกผ่านเซิร์ฟเวอร์ที่คุณจัดหาเอง (VPS ของคุณเอง) เราไม่ได้ดำเนินการเซิร์ฟเวอร์ใดๆ ไม่เห็นทราฟฟิกของคุณ และไม่มีสิทธิ์เข้าถึงการเชื่อมต่อ VPN หรือบันทึกของมัน"],["บุคคลที่สาม","แอปติดต่อเฉพาะเซิร์ฟเวอร์ที่คุณตั้งค่าไว้ เพื่อแสดงตำแหน่งเซิร์ฟเวอร์บนแผนที่ อาจส่งชื่อโฮสต์สาธารณะหรือ IP ไปยังบริการระบุพิกัดสาธารณะ (ipwhois.app หรือ ip-api.com) นี่เป็นคำขอภายนอกเพียงครั้งเดียวและไม่มีข้อมูลเกี่ยวกับคุณ"],["โฆษณา","เวอร์ชันฟรีแสดงโฆษณา Google AdMob AdMob อาจเก็บตัวระบุอุปกรณ์ (รวมถึงตัวระบุโฆษณาหากคุณอนุญาตการติดตาม) ข้อมูลโฆษณาที่คุณเห็น และข้อมูลการขัดข้องและประสิทธิภาพ — เพื่อแสดงและวัดผลโฆษณาและป้องกันการฉ้อโกง รายละเอียด: <a href=\"https://policies.google.com/privacy\">นโยบายความเป็นส่วนตัวของ Google</a> การซื้ออัปเกรด 'ไม่จำกัด' จะลบโฆษณาและหยุดการเก็บนี้ คำขออนุญาตติดตามเป็นการขอความยินยอมของคุณ เปลี่ยนได้ตลอดใน การตั้งค่า iOS → ความเป็นส่วนตัวและความปลอดภัย → การติดตาม"],["การซื้อ","การอัปเกรด 'ไม่จำกัด' ที่เป็นทางเลือกดำเนินการโดย App Store ของ Apple ทั้งหมด เราไม่เห็นข้อมูลการชำระเงิน ชื่อ หรือ Apple ID ของคุณ สถานะการซื้อจัดการโดย StoreKit บนอุปกรณ์"],["เด็ก","แอปนี้ไม่ได้มุ่งเป้าไปที่เด็กอายุต่ำกว่า 13 ปี ไม่มีบัญชีหรือเนื้อหาของเราเอง หัวข้อโฆษณาด้านบนมีผลกับผู้ใช้ทุกคนเท่าเทียมกัน"],["การเปลี่ยนแปลง","ถ้านโยบายนี้เปลี่ยน เวอร์ชันอัปเดตจะมาพร้อมแอป"],["ติดต่อ","มีคำถาม? ติดต่อเราจากหน้าผลิตภัณฑ์ใน App Store"]]},
"tr":{"title":"Gizlilik Politikası","updated":"Son güncelleme: Eylül 2026","footer":"Gizlilik Politikası","s":[["Hangi verileri topluyoruz","Hiçbiri. SSH2VPN kişisel veri toplamaz, saklamaz veya iletmez. Uygulamada hesap ve bize ait analitik yoktur. Ücretsiz sürüm üçüncü taraf reklamları gösterir — aşağıdaki Reklam bölümüne bakın."],["Verileriniz nerede yaşıyor","Her şey cihazınızda kalır. Sunucu kimlik bilgileri (parolalar, anahtarlar) yalnızca iOS anahtarlığında saklanır ve asla dışarı çıkmaz. Bağlantı ayarları ve ücretsiz süre sayacı cihazda yerel olarak saklanır."],["VPN sunucunuz","SSH2VPN trafiği sizin kendi sağladığınız sunucudan (kendi VPS'inizden) geçirir. Biz sunucu işletmeyiz, trafiğinizi görmeyiz ve VPN bağlantınıza ya da kayıtlarına erişimimiz yoktur."],["Üçüncü taraflar","Uygulama yalnızca sizin yapılandırdığınız sunucularla iletişime geçer. Sunucunun haritadaki konumunu göstermek için genel ana makine adı veya IP, genel bir konum servisine (ipwhois.app veya ip-api.com) gönderilebilir. Bu tek dış istektir ve sizinle ilgili hiçbir bilgi içermez."],["Reklam","Ücretsiz sürüm Google AdMob reklamları gösterir. AdMob, cihaz tanımlayıcıları (izlemeye izin verirseniz reklam kimliği dahil), gördüğünüz reklamlara dair bilgiler ile kilitlenme ve performans verileri toplayabilir — reklamları göstermek ve ölçmek ile sahtekarlığı önlemek için. Ayrıntılar: <a href=\"https://policies.google.com/privacy\">Google Gizlilik Politikası</a>. Sınırsız yükseltmesini satın almak reklamları kaldırır ve bu toplamayı durdurur. İzleme izni bildirimi izninizi ister; iOS Ayarlar → Gizlilik ve Güvenlik → İzleme bölümünden istediğiniz zaman değiştirebilirsiniz."],["Satın almalar","İsteğe bağlı Sınırsız yükseltmesi tamamen Apple'ın App Store'u tarafından işlenir. Ödeme bilgilerinizi, adınızı veya Apple Kimliğinizi asla görmeyiz. Satın alma durumu cihazınızdaki StoreKit tarafından yönetilir."],["Çocuklar","Uygulama 13 yaşın altındaki çocuklara yönelik değildir; hesabı veya bize ait içeriği yoktur; yukarıdaki Reklam bölümü tüm kullanıcılar için eşit geçerlidir."],["Değişiklikler","Bu politika değişirse güncel sürüm uygulama içinde gelir."],["İletişim","Sorularınız mı var? App Store ürün sayfasından bize ulaşın."]]},
"pl":{"title":"Polityka prywatności","updated":"Ostatnia aktualizacja: wrzesień 2026","footer":"Polityka prywatności","s":[["Jakie dane zbieramy","Żadnych. SSH2VPN nie zbiera, nie przechowuje ani nie przekazuje żadnych danych osobowych. W aplikacji nie ma kont ani własnej analityki. Wersja darmowa wyświetla reklamy podmiotów trzecich — patrz Reklama poniżej."],["Gdzie żyją Twoje dane","Wszystko zostaje na Twoim urządzeniu. Dane dostępowe serwera (hasła, klucze) są przechowywane wyłącznie w pęku kluczy iOS i nigdy go nie opuszczają. Ustawienia połączenia i licznik darmowego czasu są zapisane lokalnie."],["Twój serwer VPN","SSH2VPN kieruje ruch przez serwer, który sam udostępniasz (własny VPS). Nie prowadzimy żadnych serwerów, nie widzimy Twojego ruchu i nie mamy dostępu do połączenia VPN ani jego logów."],["Podmioty trzecie","Aplikacja kontaktuje się tylko z serwerami, które konfigurujesz. Aby pokazać położenie serwera na mapie, publiczna nazwa hosta lub IP może zostać wysłana do publicznej usługi geolokalizacji (ipwhois.app lub ip-api.com). To jedyne zewnętrzne zapytanie i nie zawiera nic o Tobie."],["Reklama","Wersja darmowa wyświetla reklamy Google AdMob. AdMob może zbierać identyfikatory urządzenia (w tym identyfikator reklamowy, jeśli zezwolisz na śledzenie), informacje o wyświetlonych reklamach oraz dane o awariach i wydajności — aby wyświetlać i mierzyć reklamy oraz zapobiegać oszustwom. Szczegóły: <a href=\"https://policies.google.com/privacy\">Polityka prywatności Google</a>. Kupno rozszerzenia Bez limitu usuwa reklamy i zatrzymuje to zbieranie. Monit o zgodę na śledzenie prosi o Twoją zgodę; możesz ją zmienić w dowolnym momencie w Ustawienia iOS → Prywatność i bezpieczeństwo → Śledzenie."],["Zakupy","Opcjonalne rozszerzenie Bez limitu jest obsługiwane w całości przez App Store Apple. Nigdy nie widzimy Twoich danych płatności, imienia ani Apple ID. Stan zakupu obsługuje StoreKit na Twoim urządzeniu."],["Dzieci","Aplikacja nie jest skierowana do dzieci poniżej 13 lat, nie ma kont ani własnych treści; powyższa sekcja Reklama dotyczy w równym stopniu wszystkich użytkowników."],["Zmiany","Jeśli ta polityka się zmieni, zaktualizowana wersja pojawi się w aplikacji."],["Kontakt","Pytania? Skontaktuj się z nami ze strony produktu w App Store."]]},
"nl":{"title":"Privacybeleid","updated":"Laatst bijgewerkt: september 2026","footer":"Privacybeleid","s":[["Welke gegevens we verzamelen","Geen. SSH2VPN verzamelt, bewaart of verzendt geen persoonsgegevens. Er zijn geen accounts en geen eigen analyse. De gratis versie toont advertenties van derden — zie Reclame hieronder."],["Waar jouw gegevens leven","Alles blijft op jouw toestel. Servergegevens (wachtwoorden, sleutels) staan alleen in de iOS-sleutelhanger en verlaten die nooit. Verbindingsinstellingen en de gratis-tijd-teller worden lokaal bewaard."],["Jouw VPN-server","SSH2VPN leidt verkeer via een server die je zelf levert (je eigen VPS). Wij draaien geen servers, zien je verkeer niet en hebben geen toegang tot je VPN-verbinding of de logbestanden ervan."],["Derden","De app benadert alleen de servers die jij instelt. Om de server op de kaart te tonen kan de openbare hostnaam of IP naar een openbare geo-dienst (ipwhois.app of ip-api.com) gaan. Dit is het enige externe verzoek en bevat niets over jou."],["Reclame","De gratis versie toont advertenties van Google AdMob. AdMob kan apparaat-ID's (inclusief de advertentie-ID, als je tracking toestaat), info over bekeken advertenties en crash- en prestatiegegevens verzamelen — om advertenties te tonen en te meten en fraude te voorkomen. Details: <a href=\"https://policies.google.com/privacy\">Privacybeleid van Google</a>. De upgrade Onbeperkt kopen verwijdert de advertenties en stopt deze verzameling. De tracking-toestemmingsmelding vraagt om je toestemming; altijd te wijzigen via iOS-instellingen → Privacy en beveiliging → Tracking."],["Aankopen","De optionele upgrade Onbeperkt wordt volledig door Apples App Store afgehandeld. Wij zien je betaalgegevens, naam of Apple ID nooit. De aankoopstatus wordt door StoreKit op je toestel beheerd."],["Kinderen","De app is niet gericht op kinderen onder de 13 en heeft geen accounts of eigen inhoud; de sectie Reclame hierboven geldt gelijkelijk voor alle gebruikers."],["Wijzigingen","Verandert dit beleid, dan komt de bijgewerkte versie in de app."],["Contact","Vragen? Neem contact op via de productpagina in de App Store."]]},
"vi":{"title":"Chính sách Bảo mật","updated":"Cập nhật lần cuối: tháng 9 năm 2026","footer":"Chính sách Bảo mật","s":[["Dữ liệu chúng tôi thu thập","Không có. SSH2VPN không thu thập, lưu trữ hay truyền dữ liệu cá nhân nào. Không tài khoản và không phân tích của riêng chúng tôi. Bản miễn phí hiển thị quảng cáo của bên thứ ba — xem Quảng cáo bên dưới."],["Dữ liệu của bạn nằm ở đâu","Mọi thứ đều ở trên thiết bị của bạn. Thông tin đăng nhập máy chủ (mật khẩu, khóa) chỉ được lưu trong Keychain của iOS và không bao giờ rời khỏi đó. Cài đặt kết nối và bộ đếm thời gian miễn phí được lưu cục bộ trên thiết bị."],["Máy chủ VPN của bạn","SSH2VPN định tuyến lưu lượng qua máy chủ bạn tự cung cấp (VPS riêng của bạn). Chúng tôi không vận hành máy chủ nào, không thấy lưu lượng của bạn và không có quyền truy cập kết nối VPN hay nhật ký của nó."],["Bên thứ ba","Ứng dụng chỉ liên lạc với các máy chủ bạn cấu hình. Để hiển thị vị trí máy chủ trên bản đồ, tên máy chủ công khai hoặc IP có thể được gửi đến dịch vụ định vị công khai (ipwhois.app hoặc ip-api.com). Đây là yêu cầu ngoài duy nhất và không chứa thông tin gì về bạn."],["Quảng cáo","Bản miễn phí hiển thị quảng cáo Google AdMob. AdMob có thể thu thập mã định danh thiết bị (kể cả mã định danh quảng cáo nếu bạn cho phép theo dõi), thông tin về quảng cáo bạn xem, dữ liệu sự cố và hiệu năng — để hiển thị, đo lường quảng cáo và chống gian lận. Chi tiết: <a href=\"https://policies.google.com/privacy\">Chính sách Bảo mật của Google</a>. Mua nâng cấp 'Không giới hạn' sẽ gỡ quảng cáo và dừng việc thu thập này. Lời nhắc xin phép theo dõi hỏi ý bạn; có thể đổi bất cứ lúc nào trong Cài đặt iOS → Quyền riêng tư & Bảo mật → Theo dõi."],["Mua hàng","Nâng cấp 'Không giới hạn' tùy chọn được App Store của Apple xử lý hoàn toàn. Chúng tôi không bao giờ thấy thông tin thanh toán, tên hay Apple ID của bạn. Trạng thái mua hàng do StoreKit quản lý trên thiết bị."],["Trẻ em","Ứng dụng không dành cho trẻ em dưới 13 tuổi, không có tài khoản hay nội dung riêng; mục Quảng cáo ở trên áp dụng như nhau cho mọi người dùng."],["Thay đổi","Nếu chính sách này thay đổi, phiên bản cập nhật sẽ đi kèm trong ứng dụng."],["Liên hệ","Có câu hỏi? Liên hệ qua trang sản phẩm trên App Store."]]},
"zh-Hans":"zh","pt-BR":"pt"
};
const FLAGS = {en:"\u{1F1EC}\u{1F1E7}",es:"\u{1F1EA}\u{1F1F8}",de:"\u{1F1E9}\u{1F1EA}",fr:"\u{1F1EB}\u{1F1F0}",it:"\u{1F1EE}\u{1F1F9}",pt:"\u{1F1E7}\u{1F1F7}",ja:"\u{1F1EF}\u{1F1F5}",zh:"\u{1F1E8}\u{1F1F3}",ko:"\u{1F1F0}\u{1F1F7}",ar:"\u{1F1F8}\u{1F1E6}",hi:"\u{1F1EE}\u{1F1F3}",th:"\u{1F1F9}\u{1F1ED}",tr:"\u{1F1F9}\u{1F1F7}",pl:"\u{1F1F5}\u{1F1F1}",nl:"\u{1F1F3}\u{1F1F1}",vi:"\u{1F1FB}\u{1F1F3}",ru:"\u{1F1F7}\u{1F1FA}"};
const NAMES = {en:"English",es:"Espa\u00f1ol",de:"Deutsch",fr:"Fran\u00e7ais",it:"Italiano",pt:"Portugu\u00eas",ja:"\u65e5\u672c\u8a9e",zh:"\u7b80\u4f53\u4e2d\u6587",ko:"\ud55c\uad6d\uc5b4",ar:"\u0627\u0644\u0639\u0631\u0628\u064a\u0629",hi:"\u0939\u093f\u0928\u094d\u0926\u0940",th:"\u0e44\u0e17\u0e22",tr:"T\u00fcrk\u00e7e",pl:"Polski",nl:"Nederlands",vi:"Ti\u1ebfng Vi\u1ec7t",ru:"\u0420\u0443\u0441\u0441\u043a\u0438\u0439"};
// Russian is LAST on purpose (owner's decision).
const ORDER = ["en","es","de","fr","it","pt","ja","zh","ko","ar","hi","th","tr","pl","nl","vi","ru"];
let cur = (window.APP_LANG || navigator.language || "en");
if (!T[cur] || typeof T[cur] === "string") {
  const l = String(cur).toLowerCase();
  if (T[l] && typeof T[l] === "object") { cur = l; }
  else if (T[l.split("-")[0]] && typeof T[l.split("-")[0]] === "object") { cur = l.split("-")[0]; }
  else { cur = "en"; }
}
if (typeof T[cur] === "string") { cur = T[cur]; }
function apply(){
  const sel = document.getElementById("lang");
  if (sel && sel.value) { cur = sel.value; }
  const t = (typeof T[cur] === "object") ? T[cur] : T.en;
  document.getElementById("t-title").textContent = t.title;
  document.getElementById("t-updated").textContent = t.updated;
  document.getElementById("t-footer").textContent = t.footer;
  document.getElementById("body").innerHTML = t.s.map(function(x,i){
    return "<section><h2><span class='n'>"+(i+1)+"</span>"+x[0]+"</h2><p>"+x[1]+"</p></section>";
  }).join("");
}
(function init(){
  const sel = document.getElementById("lang");
  for (const k of ORDER) {
    if (typeof T[k] !== "object") continue;
    const o = document.createElement("option");
    o.value = k; o.textContent = (FLAGS[k]||"") + " " + NAMES[k];
    sel.appendChild(o);
  }
  sel.value = cur;
  apply();
})();
</script>
</body>
