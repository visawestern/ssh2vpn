const T = {
"en":{"title":"Privacy Policy","updated":"Last updated: September 2026","footer":"Privacy Policy","s":[["What data we collect","None. SSH2VPN does not collect, store, or transmit any personal data. There are no accounts, no analytics, no trackers, and no advertising identifiers inside the app."],["Where your data lives","Everything stays on your device. Server credentials (passwords, keys) are stored only in the iOS Keychain and never leave it. Connection settings and the free-time ledger are stored locally on your device."],["Your VPN server","SSH2VPN routes traffic through a server you provide yourself (your own VPS). We do not operate any servers, do not see your traffic, and have no access to your VPN connection or its logs."],["Third parties","The app contacts only the servers you configure. To show a server's location on the map, the public hostname or IP may be sent to a public geo-lookup service (ipwhois.app or ip-api.com). This is the only external request, and it contains no information about you or your browsing."],["Purchases","The optional Unlimited upgrade is processed entirely by Apple's App Store. We never see your payment details, name, or Apple ID. Purchase state is handled by StoreKit on your device."],["Children","The app is not directed at children under 13 and collects nothing from anyone, including children."],["Changes","If this policy ever changes, the updated version will ship inside the app."],["Contact","Questions? Contact us from the App Store product page."]]},
"ru":{"title":"Политика конфиденциальности","updated":"Обновлено: сентябрь 2026","footer":"Политика конфиденциальности","s":[["Какие данные мы собираем","Никаких. SSH2VPN не собирает, не хранит и не передаёт персональные данные. В приложении нет аккаунтов, аналитики, трекеров и рекламных идентификаторов."],["Где хранятся ваши данные","Всё остаётся на вашем устройстве. Пароли и ключи сервера хранятся только в связке ключей iOS и никогда не покидают её. Настройки подключения и счётчик бесплатного времени хранятся локально на устройстве."],["Ваш VPN-сервер","SSH2VPN направляет трафик через сервер, который вы предоставляете сами (ваш собственный VPS). Мы не управляем серверами, не видим ваш трафик и не имеем доступа к вашему VPN-подключению и его журналам."],["Сторонние сервисы","Приложение обращается только к серверам, которые вы настроили. Чтобы показать положение сервера на карте, публичное имя или IP может быть отправлено в публичный сервис геолокации (ipwhois.app или ip-api.com). Это единственный внешний запрос, и он не содержит никаких данных о вас и ваших действиях в сети."],["Покупки","Необязательное расширение «Безлимит» обрабатывается полностью Магазином приложений Apple. Мы не видим ваши платёжные данные, имя и Apple ID. Состояние покупки обрабатывается StoreKit на вашем устройстве."],["Дети","Приложение не предназначено для детей до 13 лет и не собирает ничего ни от кого, включая детей."],["Изменения","Если политика изменится, обновлённая версия появится внутри приложения."],["Связь","Вопросы? Свяжитесь с нами со страницы приложения в App Store."]]},
"es":{"title":"Política de Privacidad","updated":"Última actualización: septiembre de 2026","footer":"Política de Privacidad","s":[["Qué datos recopilamos","Ninguno. SSH2VPN no recopila, almacena ni transmite datos personales. No hay cuentas, analíticas, rastreadores ni identificadores publicitarios en la aplicación."],["Dónde viven tus datos","Todo permanece en tu dispositivo. Las credenciales del servidor (contraseñas, claves) se guardan solo en el llavero de iOS y nunca salen de él. Los ajustes y el contador de tiempo gratuito se almacenan localmente."],["Tu servidor VPN","SSH2VPN dirige el tráfico a través de un servidor que tú mismo proporcionas (tu propio VPS). No operamos servidores, no vemos tu tráfico ni tenemos acceso a tu conexión VPN o sus registros."],["Terceros","La app solo contacta los servidores que configuras. Para mostrar la ubicación del servidor en el mapa, el nombre público o la IP puede enviarse a un servicio público de geolocalización (ipwhois.app o ip-api.com). Es la única petición externa y no contiene información sobre ti ni tu navegación."],["Compras","La mejora opcional Ilimitado la procesa íntegramente el App Store de Apple. Nunca vemos tus datos de pago, nombre o Apple ID. El estado de la compra lo gestiona StoreKit en tu dispositivo."],["Niños","La app no está dirigida a menores de 13 años y no recopila nada de nadie, incluidos niños."],["Cambios","Si esta política cambia, la versión actualizada se incluirá en la app."],["Contacto","¿Preguntas? Contáctanos desde la página del producto en App Store."]]},
"de":{"title":"Datenschutzerklärung","updated":"Zuletzt aktualisiert: September 2026","footer":"Datenschutzerklärung","s":[["Welche Daten wir erheben","Keine. SSH2VPN erhebt, speichert oder übermittelt keine personenbezogenen Daten. Es gibt keine Konten, keine Analysen, keine Tracker und keine Werbe-IDs in der App."],["Wo deine Daten leben","Alles bleibt auf deinem Gerät. Server-Zugangsdaten (Passwörter, Schlüssel) liegen nur im iOS-Schlüsselbund und verlassen ihn nie. Einstellungen und das Gratis-Zeit-Konto werden lokal gespeichert."],["Dein VPN-Server","SSH2VPN leitet den Traffic über einen Server, den du selbst bereitstellst (dein eigener VPS). Wir betreiben keine Server, sehen deinen Traffic nicht und haben keinen Zugriff auf deine VPN-Verbindung oder deren Protokolle."],["Dritte","Die App kontaktiert nur die Server, die du konfigurierst. Um den Server auf der Karte zu zeigen, kann der öffentliche Name oder die IP an einen öffentlichen Geo-Dienst (ipwhois.app oder ip-api.com) gesendet werden. Das ist die einzige externe Anfrage und enthält nichts über dich."],["Käufe","Das optionale Upgrade Unbegrenzt wird vollständig von Apples App Store abgewickelt. Wir sehen deine Zahlungsdaten, deinen Namen oder deine Apple-ID nie. Der Kaufstatus wird von StoreKit auf deinem Gerät verwaltet."],["Kinder","Die App richtet sich nicht an Kinder unter 13 und erhebt von niemandem etwas, auch nicht von Kindern."],["Änderungen","Ändert sich diese Richtlinie, erscheint die aktualisierte Version in der App."],["Kontakt","Fragen? Kontaktiere uns über die Produktseite im App Store."]]},
"fr":{"title":"Politique de Confidentialité","updated":"Dernière mise à jour : septembre 2026","footer":"Politique de Confidentialité","s":[["Quelles données nous collectons","Aucune. SSH2VPN ne collecte, ne stocke ni ne transmet aucune donnée personnelle. Pas de comptes, pas d'analytique, pas de traceurs ni d'identifiants publicitaires dans l'app."],["Où vivent vos données","Tout reste sur votre appareil. Les identifiants du serveur (mots de passe, clés) sont stockés uniquement dans le trousseau iOS et n'en sortent jamais. Les réglages et le compteur de temps gratuit sont stockés localement."],["Votre serveur VPN","SSH2VPN achemine le trafic via un serveur que vous fournissez vous-même (votre propre VPS). Nous n'exploitons aucun serveur, ne voyons pas votre trafic et n'avons accès ni à votre connexion VPN ni à ses journaux."],["Tiers","L'app ne contacte que les serveurs que vous configurez. Pour afficher la position du serveur sur la carte, le nom public ou l'IP peut être envoyé à un service public de géolocalisation (ipwhois.app ou ip-api.com). C'est la seule requête externe, sans aucune donnée sur vous."],["Achats","L'upgrade optionnelle Illimité est traitée entièrement par l'App Store d'Apple. Nous ne voyons jamais vos données de paiement, votre nom ou votre identifiant Apple. L'état de l'achat est géré par StoreKit sur votre appareil."],["Enfants","L'app ne s'adresse pas aux enfants de moins de 13 ans et ne collecte rien de personne, enfants inclus."],["Changements","Si cette politique change, la version mise à jour sera intégrée à l'app."],["Contact","Des questions ? Contactez-nous depuis la page produit de l'App Store."]]},
"it":{"title":"Informativa sulla Privacy","updated":"Ultimo aggiornamento: settembre 2026","footer":"Informativa sulla Privacy","s":[["Quali dati raccogliamo","Nessuno. SSH2VPN non raccoglie, archivia né trasmette dati personali. Nessun account, nessuna analitica, nessun tracker né identificatori pubblicitari nell'app."],["Dove vivono i tuoi dati","Tutto resta sul dispositivo. Le credenziali del server (password, chiavi) stanno solo nel portachiavi iOS e non lo lasciano mai. Impostazioni e contatore del tempo gratuito sono salvati in locale."],["Il tuo server VPN","SSH2VPN instrada il traffico tramite un server che fornisci tu (il tuo VPS). Non gestiamo server, non vediamo il tuo traffico e non abbiamo accesso alla connessione VPN o ai suoi log."],["Terze parti","L'app contatta solo i server che configuri. Per mostrare la posizione del server sulla mappa, il nome pubblico o l'IP può essere inviato a un servizio pubblico di geolocalizzazione (ipwhois.app o ip-api.com). È l'unica richiesta esterna e non contiene dati su di te."],["Acquisti","Il miglioramento opzionale Illimitato è gestito interamente dall'App Store di Apple. Non vediamo mai i tuoi dati di pagamento, nome o Apple ID. Lo stato dell'acquisto è gestito da StoreKit sul dispositivo."],["Bambini","L'app non è rivolta ai minori di 13 anni e non raccoglie nulla da nessuno, bambini inclusi."],["Modifiche","Se questa informativa cambierà, la versione aggiornata sarà inclusa nell'app."],["Contatti","Domande? Contattaci dalla pagina prodotto sull'App Store."]]},
"pt":{"title":"Política de Privacidade","updated":"Última atualização: setembro de 2026","footer":"Política de Privacidade","s":[["Quais dados coletamos","Nenhum. O SSH2VPN não coleta, armazena nem transmite dados pessoais. Não há contas, análises, rastreadores nem identificadores de anúncios no app."],["Onde vivem seus dados","Tudo fica no seu dispositivo. As credenciais do servidor (senhas, chaves) ficam apenas no chaveiro do iOS e nunca saem dele. Ajustes e o contador de tempo grátis ficam armazenados localmente."],["Seu servidor VPN","O SSH2VPN roteia o tráfego por um servidor que você mesmo fornece (seu próprio VPS). Não operamos servidores, não vemos seu tráfego e não temos acesso à sua conexão VPN ou aos registros dela."],["Terceiros","O app contata apenas os servidores que você configura. Para mostrar a posição do servidor no mapa, o nome público ou o IP pode ser enviado a um serviço público de geolocalização (ipwhois.app ou ip-api.com). É a única requisição externa e não contém nada sobre você."],["Compras","O upgrade opcional Ilimitado é processado inteiramente pela App Store da Apple. Nunca vemos seus dados de pagamento, nome ou Apple ID. O estado da compra é gerenciado pelo StoreKit no seu dispositivo."],["Crianças","O app não é direcionado a menores de 13 anos e não coleta nada de ninguém, incluindo crianças."],["Alterações","Se esta política mudar, a versão atualizada virá dentro do app."],["Contato","Dúvidas? Fale conosco pela página do produto na App Store."]]},
"ja":{"title":"プライバシーポリシー","updated":"最終更新：2026年9月","footer":"プライバシーポリシー","s":[["収集するデータ","なし。SSH2VPNは個人データを収集・保存・送信しません。アカウント、アナリティクス、トラッカー、広告識別子は一切ありません。"],["データの保存場所","すべて端末内に留まります。サーバーの認証情報（パスワード、鍵）はiOSのキーチェーンのみに保存され、外部に出ることはありません。接続設定と無料時間のカウンターも端末内に保存されます。"],["あなたのVPNサーバー","SSH2VPNは、あなた自身が用意したサーバー（自分のVPS）経由でトラフィックを流します。当社はサーバーを運営せず、トラフィックを見ることも、VPN接続やそのログにアクセスすることもできません。"],["第三者","アプリが通信するのは、あなたが設定したサーバーだけです。サーバーの場所を地図に表示するため、公開ホスト名やIPを公開ジオサービス（ipwhois.app または ip-api.com）に送ることがあります。これが唯一の外部リクエストで、あなたに関する情報は含まれません。"],["購入","オプションの「無制限」アップグレードはAppleのApp Storeが完全に処理します。お支払い情報、お名前、Apple IDは一切見えません。購入状態は端末上のStoreKitが管理します。"],["子供","本アプリは13歳未満の子供を対象としておらず、誰からも何も収集しません。"],["変更","本ポリシーが変わる場合は、更新版がアプリ内に同梱されます。"],["お問い合わせ","ご質問はApp Storeの商品ページからご連絡ください。"]]},
"zh":{"title":"隐私政策","updated":"最后更新：2026年9月","footer":"隐私政策","s":[["我们收集哪些数据","不收集任何数据。SSH2VPN 不收集、存储或传输任何个人数据。应用内没有账户、分析、跟踪器或广告标识符。"],["数据存在哪里","一切都保存在您的设备上。服务器凭据（密码、密钥）仅存储在 iOS 钥匙串中，绝不会离开设备。连接设置和免费时长计数也仅本地存储。"],["您的 VPN 服务器","SSH2VPN 通过您自行提供的服务器（您自己的 VPS）路由流量。我们不运营任何服务器，看不到您的流量，也无法访问您的 VPN 连接或其日志。"],["第三方","应用只与您配置的服务器通信。为了在地图上显示服务器位置，可能会将公开主机名或 IP 发送到公共地理查询服务（ipwhois.app 或 ip-api.com）。这是唯一的外部请求，且不包含任何关于您或您浏览活动的信息。"],["购买","可选的「不限量」升级完全由 Apple 的 App Store 处理。我们永远看不到您的支付信息、姓名或 Apple ID。购买状态由设备上的 StoreKit 管理。"],["儿童","本应用不面向 13 岁以下儿童，也不会向任何人（包括儿童）收集任何信息。"],["变更","若本政策发生变更，更新版本将随应用内附送。"],["联系方式","有疑问？请通过 App Store 产品页与我们联系。"]]},
"ko":{"title":"개인정보 처리방침","updated":"마지막 업데이트: 2026년 9월","footer":"개인정보 처리방침","s":[["어떤 데이터를 수집하나요","없습니다. SSH2VPN은 개인 데이터를 수집·저장·전송하지 않습니다. 앱에 계정, 분석, 추적기, 광고 식별자가 없습니다."],["데이터가 저장되는 곳","모두 기기에 남습니다. 서버 자격 증명(비밀번호, 키)은 iOS 키체인에만 저장되고 절대 나가지 않습니다. 연결 설정과 무료 시간 카운터도 기기에 로컬로 저장됩니다."],["사용자의 VPN 서버","SSH2VPN은 사용자가 직접 제공하는 서버(자신의 VPS)를 통해 트래픽을 라우팅합니다. 우리는 서버를 운영하지 않고, 트래픽을 볼 수 없으며, VPN 연결이나 그 로그에 접근할 수 없습니다."],["제3자","앱은 사용자가 설정한 서버에만 연결합니다. 지도에 서버 위치를 표시하기 위해 공개 호스트명이나 IP를 공개 지오 서비스(ipwhois.app 또는 ip-api.com)로 보낼 수 있습니다. 이것이 유일한 외부 요청이며 사용자에 대한 정보는 포함되지 않습니다."],["구매","선택적 '무제한' 업그레이드는 Apple의 App Store가 완전히 처리합니다. 결제 정보, 이름, Apple ID는 절대 보지 못합니다. 구매 상태는 기기의 StoreKit이 관리합니다."],["아동","이 앱은 13세 미만 아동을 대상으로 하지 않으며, 아동을 포함한 누구에게서도 아무것도 수집하지 않습니다."],["변경","이 방침이 변경되면 업데이트된 버전이 앱 안에 포함되어 배포됩니다."],["연락","궁금한 점은 App Store 제품 페이지에서 문의하세요."]]},
"ar":{"title":"سياسة الخصوصية","updated":"آخر تحديث: سبتمبر 2026","footer":"سياسة الخصوصية","s":[["البيانات التي نجمعها","لا شيء. لا يجمع SSH2VPN أي بيانات شخصية ولا يخزنها ولا يرسلها. لا حسابات ولا تحليلات ولا متتبعات ولا معرفات إعلانية داخل التطبيق."],["أين تُخزَّن بياناتك","كل شيء يبقى على جهازك. بيانات اعتماد الخادم (كلمات المرور والمفاتيح) تُخزَّن في سلسلة مفاتيح iOS فقط ولا تغادرها أبدًا. إعدادات الاتصال وعداد الوقت المجاني مخزنة محليًا على الجهاز."],["خادم VPN الخاص بك","يمرر SSH2VPN حركة المرور عبر خادم توفره أنت بنفسك (خادم VPS الخاص بك). لا نشغّل أي خوادم ولا نرى حركة مرورك ولا نملك وصولًا إلى اتصال VPN أو سجلاته."],["الأطراف الثالثة","يتواصل التطبيق فقط مع الخوادم التي تهيئها. لعرض موقع الخادم على الخريطة قد يُرسل اسم المضيف العام أو عنوان IP إلى خدمة تحديد موقع عامة (ipwhois.app أو ip-api.com). هذا هو الطلب الخارجي الوحيد ولا يحتوي على أي معلومات عنك."],["المشتريات","تُعالج ترقية «غير المحدود» الاختيارية بالكامل عبر App Store من Apple. لا نرى أبدًا بيانات الدفع أو اسمك أو معرّف Apple. تُدار حالة الشراء عبر StoreKit على جهازك."],["الأطفال","التطبيق ليس موجهًا للأطفال دون 13 عامًا ولا يجمع أي شيء من أي شخص، بمن فيهم الأطفال."],["التغييرات","إذا تغيرت هذه السياسة، ستأتي النسخة المحدثة داخل التطبيق."],["التواصل","أسئلة؟ تواصل معنا من صفحة المنتج في App Store."]]},
"hi":{"title":"गोपनीयता नीति","updated":"अंतिम अपडेट: सितंबर 2026","footer":"गोपनीयता नीति","s":[["हम कौन सा डेटा एकत्र करते हैं","कोई नहीं। SSH2VPN कोई व्यक्तिगत डेटा एकत्र, संग्रहीत या संचारित नहीं करता। ऐप में कोई खाते, विश्लेषण, ट्रैकर या विज्ञापन पहचानकर्ता नहीं हैं।"],["आपका डेटा कहाँ रहता है","सब कुछ आपके डिवाइस पर रहता है। सर्वर क्रेडेंशियल (पासवर्ड, कुंजियाँ) केवल iOS कीचेन में संग्रहीत होते हैं और कभी बाहर नहीं जाते। कनेक्शन सेटिंग्स और मुफ़्त समय का काउंटर स्थानीय रूप से संग्रहीत हैं।"],["आपका VPN सर्वर","SSH2VPN ट्रैफ़िक को उस सर्वर से गुज़ारता है जो आप स्वयं देते हैं (आपका अपना VPS)। हम कोई सर्वर नहीं चलाते, आपका ट्रैफ़िक नहीं देखते, और न ही आपके VPN कनेक्शन या उसके लॉग तक पहुँच रखते हैं।"],["तृतीय पक्ष","ऐप केवल उन सर्वरों से संपर्क करता है जिन्हें आप सेट करते हैं। मैप पर सर्वर की स्थिति दिखाने के लिए सार्वजनिक होस्टनेम या IP को सार्वजनिक जियो सेवा (ipwhois.app या ip-api.com) को भेजा जा सकता है। यही एकमात्र बाहरी अनुरोध है और इसमें आपके बारे में कुछ भी नहीं होता।"],["खरीद","वैकल्पिक 'असीमित' अपग्रेड पूरी तरह Apple के App Store द्वारा संसाधित होता है। हम आपके भुगतान विवरण, नाम या Apple ID कभी नहीं देखते। खरीद की स्थिति आपके डिवाइस पर StoreKit द्वारा प्रबंधित होती है।"],["बच्चे","यह ऐप 13 वर्ष से कम आयु के बच्चों के लिए नहीं है और किसी से भी कुछ एकत्र नहीं करता, बच्चों सहित।"],["परिवर्तन","अगर यह नीति बदलती है, तो अपडेट संस्करण ऐप के अंदर आ जाएगा।"],["संपर्क","प्रश्न? App Store उत्पाद पेज से हमसे संपर्क करें।"]]},
"th":{"title":"นโยบายความเป็นส่วนตัว","updated":"อัปเดตล่าสุด: กันยายน 2026","footer":"นโยบายความเป็นส่วนตัว","s":[["เราเก็บข้อมูลอะไรบ้าง","ไม่มีเลย SSH2VPN ไม่เก็บ ไม่จัดเก็บ และไม่ส่งข้อมูลส่วนบุคคลใดๆ ไม่มีบัญชี ไม่มีการวิเคราะห์ ไม่มีตัวติดตาม และไม่มีตัวระบุโฆษณาในแอป"],["ข้อมูลของคุณอยู่ที่ไหน","ทุกอย่างอยู่บนอุปกรณ์ของคุณ ข้อมูลเข้าสู่ระบบเซิร์ฟเวอร์ (รหัสผ่าน คีย์) เก็บใน Keychain ของ iOS เท่านั้นและไม่เคยออกจากอุปกรณ์ การตั้งค่าการเชื่อมต่อและตัวนับเวลาฟรีเก็บไว้ในเครื่อง"],["เซิร์ฟเวอร์ VPN ของคุณ","SSH2VPN ส่งทราฟฟิกผ่านเซิร์ฟเวอร์ที่คุณจัดหาเอง (VPS ของคุณเอง) เราไม่ได้ดำเนินการเซิร์ฟเวอร์ใดๆ ไม่เห็นทราฟฟิกของคุณ และไม่มีสิทธิ์เข้าถึงการเชื่อมต่อ VPN หรือบันทึกของมัน"],["บุคคลที่สาม","แอปติดต่อเฉพาะเซิร์ฟเวอร์ที่คุณตั้งค่าไว้ เพื่อแสดงตำแหน่งเซิร์ฟเวอร์บนแผนที่ อาจส่งชื่อโฮสต์สาธารณะหรือ IP ไปยังบริการระบุพิกัดสาธารณะ (ipwhois.app หรือ ip-api.com) นี่เป็นคำขอภายนอกเพียงครั้งเดียวและไม่มีข้อมูลเกี่ยวกับคุณ"],["การซื้อ","การอัปเกรด 'ไม่จำกัด' ที่เป็นทางเลือกดำเนินการโดย App Store ของ Apple ทั้งหมด เราไม่เห็นข้อมูลการชำระเงิน ชื่อ หรือ Apple ID ของคุณ สถานะการซื้อจัดการโดย StoreKit บนอุปกรณ์"],["เด็ก","แอปนี้ไม่ได้มุ่งเป้าไปที่เด็กอายุต่ำกว่า 13 ปี และไม่เก็บอะไรจากใครเลย รวมถึงเด็ก"],["การเปลี่ยนแปลง","ถ้านโยบายนี้เปลี่ยน เวอร์ชันอัปเดตจะมาพร้อมแอป"],["ติดต่อ","มีคำถาม? ติดต่อเราจากหน้าผลิตภัณฑ์ใน App Store"]]},
"tr":{"title":"Gizlilik Politikası","updated":"Son güncelleme: Eylül 2026","footer":"Gizlilik Politikası","s":[["Hangi verileri topluyoruz","Hiçbiri. SSH2VPN kişisel veri toplamaz, saklamaz veya iletmez. Uygulamada hesap, analitik, izleyici veya reklam kimliği yoktur."],["Verileriniz nerede yaşıyor","Her şey cihazınızda kalır. Sunucu kimlik bilgileri (parolalar, anahtarlar) yalnızca iOS anahtarlığında saklanır ve asla dışarı çıkmaz. Bağlantı ayarları ve ücretsiz süre sayacı cihazda yerel olarak saklanır."],["VPN sunucunuz","SSH2VPN trafiği sizin kendi sağladığınız sunucudan (kendi VPS'inizden) geçirir. Biz sunucu işletmeyiz, trafiğinizi görmeyiz ve VPN bağlantınıza ya da kayıtlarına erişimimiz yoktur."],["Üçüncü taraflar","Uygulama yalnızca sizin yapılandırdığınız sunucularla iletişime geçer. Sunucunun haritadaki konumunu göstermek için genel ana makine adı veya IP, genel bir konum servisine (ipwhois.app veya ip-api.com) gönderilebilir. Bu tek dış istektir ve sizinle ilgili hiçbir bilgi içermez."],["Satın almalar","İsteğe bağlı Sınırsız yükseltmesi tamamen Apple'ın App Store'u tarafından işlenir. Ödeme bilgilerinizi, adınızı veya Apple Kimliğinizi asla görmeyiz. Satın alma durumu cihazınızdaki StoreKit tarafından yönetilir."],["Çocuklar","Uygulama 13 yaşın altındaki çocuklara yönelik değildir ve kimseden, çocuklar dahil, hiçbir şey toplamaz."],["Değişiklikler","Bu politika değişirse güncel sürüm uygulama içinde gelir."],["İletişim","Sorularınız mı var? App Store ürün sayfasından bize ulaşın."]]},
"pl":{"title":"Polityka prywatności","updated":"Ostatnia aktualizacja: wrzesień 2026","footer":"Polityka prywatności","s":[["Jakie dane zbieramy","Żadnych. SSH2VPN nie zbiera, nie przechowuje ani nie przekazuje żadnych danych osobowych. W aplikacji nie ma kont, analityki, trackerów ani identyfikatorów reklamowych."],["Gdzie żyją Twoje dane","Wszystko zostaje na Twoim urządzeniu. Dane dostępowe serwera (hasła, klucze) są przechowywane wyłącznie w pęku kluczy iOS i nigdy go nie opuszczają. Ustawienia połączenia i licznik darmowego czasu są zapisane lokalnie."],["Twój serwer VPN","SSH2VPN kieruje ruch przez serwer, który sam udostępniasz (własny VPS). Nie prowadzimy żadnych serwerów, nie widzimy Twojego ruchu i nie mamy dostępu do połączenia VPN ani jego logów."],["Podmioty trzecie","Aplikacja kontaktuje się tylko z serwerami, które konfigurujesz. Aby pokazać położenie serwera na mapie, publiczna nazwa hosta lub IP może zostać wysłana do publicznej usługi geolokalizacji (ipwhois.app lub ip-api.com). To jedyne zewnętrzne zapytanie i nie zawiera nic o Tobie."],["Zakupy","Opcjonalne rozszerzenie Bez limitu jest obsługiwane w całości przez App Store Apple. Nigdy nie widzimy Twoich danych płatności, imienia ani Apple ID. Stan zakupu obsługuje StoreKit na Twoim urządzeniu."],["Dzieci","Aplikacja nie jest skierowana do dzieci poniżej 13 lat i nie zbiera nic od nikogo, w tym od dzieci."],["Zmiany","Jeśli ta polityka się zmieni, zaktualizowana wersja pojawi się w aplikacji."],["Kontakt","Pytania? Skontaktuj się z nami ze strony produktu w App Store."]]},
"nl":{"title":"Privacybeleid","updated":"Laatst bijgewerkt: september 2026","footer":"Privacybeleid","s":[["Welke gegevens we verzamelen","Geen. SSH2VPN verzamelt, bewaart of verzendt geen persoonsgegevens. Er zijn geen accounts, analyses, trackers of advertentie-ID's in de app."],["Waar jouw gegevens leven","Alles blijft op jouw toestel. Servergegevens (wachtwoorden, sleutels) staan alleen in de iOS-sleutelhanger en verlaten die nooit. Verbindingsinstellingen en de gratis-tijd-teller worden lokaal bewaard."],["Jouw VPN-server","SSH2VPN leidt verkeer via een server die je zelf levert (je eigen VPS). Wij draaien geen servers, zien je verkeer niet en hebben geen toegang tot je VPN-verbinding of de logbestanden ervan."],["Derden","De app benadert alleen de servers die jij instelt. Om de server op de kaart te tonen kan de openbare hostnaam of IP naar een openbare geo-dienst (ipwhois.app of ip-api.com) gaan. Dit is het enige externe verzoek en bevat niets over jou."],["Aankopen","De optionele upgrade Onbeperkt wordt volledig door Apples App Store afgehandeld. Wij zien je betaalgegevens, naam of Apple ID nooit. De aankoopstatus wordt door StoreKit op je toestel beheerd."],["Kinderen","De app is niet gericht op kinderen onder de 13 en verzamelt niets van niemand, ook niet van kinderen."],["Wijzigingen","Verandert dit beleid, dan komt de bijgewerkte versie in de app."],["Contact","Vragen? Neem contact op via de productpagina in de App Store."]]},
"vi":{"title":"Chính sách Bảo mật","updated":"Cập nhật lần cuối: tháng 9 năm 2026","footer":"Chính sách Bảo mật","s":[["Dữ liệu chúng tôi thu thập","Không có. SSH2VPN không thu thập, lưu trữ hay truyền dữ liệu cá nhân nào. Không tài khoản, không phân tích, không trình theo dõi, không mã định danh quảng cáo trong ứng dụng."],["Dữ liệu của bạn nằm ở đâu","Mọi thứ đều ở trên thiết bị của bạn. Thông tin đăng nhập máy chủ (mật khẩu, khóa) chỉ được lưu trong Keychain của iOS và không bao giờ rời khỏi đó. Cài đặt kết nối và bộ đếm thời gian miễn phí được lưu cục bộ trên thiết bị."],["Máy chủ VPN của bạn","SSH2VPN định tuyến lưu lượng qua máy chủ bạn tự cung cấp (VPS riêng của bạn). Chúng tôi không vận hành máy chủ nào, không thấy lưu lượng của bạn và không có quyền truy cập kết nối VPN hay nhật ký của nó."],["Bên thứ ba","Ứng dụng chỉ liên lạc với các máy chủ bạn cấu hình. Để hiển thị vị trí máy chủ trên bản đồ, tên máy chủ công khai hoặc IP có thể được gửi đến dịch vụ định vị công khai (ipwhois.app hoặc ip-api.com). Đây là yêu cầu ngoài duy nhất và không chứa thông tin gì về bạn."],["Mua hàng","Nâng cấp 'Không giới hạn' tùy chọn được App Store của Apple xử lý hoàn toàn. Chúng tôi không bao giờ thấy thông tin thanh toán, tên hay Apple ID của bạn. Trạng thái mua hàng do StoreKit quản lý trên thiết bị."],["Trẻ em","Ứng dụng không dành cho trẻ em dưới 13 tuổi và không thu thập gì từ bất kỳ ai, kể cả trẻ em."],["Thay đổi","Nếu chính sách này thay đổi, phiên bản cập nhật sẽ đi kèm trong ứng dụng."],["Liên hệ","Có câu hỏi? Liên hệ qua trang sản phẩm trên App Store."]]},

  const sel = document.getElementById("lang");

  const t = (typeof T[cur] === "object") ? T[cur] : T.en;
  document.getElementById("flag").textContent = FLAGS[cur] || "\u{1F310}";
  document.getElementById("t-title").textContent = t.title;
  document.getElementById("t-updated").textContent = t.updated;
  document.getElementById("t-footer").textContent = t.footer;
  document.getElementById("body").innerHTML = t.s.map(function(x,i){
    return "<section><h2><span class='n'>"+(i+1)+"</span>"+x[0]+"</h2><p>"+x[1]+"</p></section>";
  }).join("");
}
(function init(){
  const sel = document.getElementById("lang");
  for (const k of ORDER) {
    if (typeof T[k] !== "object") continue;
    const o = document.createElement("option");
    o.value = k; o.textContent = (FLAGS[k]||"") + " " + NAMES[k];
    sel.appendChild(o);
  }
  sel.value = cur;
  apply();
})();
</script>
</body>
