const T = {
"en":{"title":"Support","updated":"SSH2VPN — Your VPS, Your VPN","footer":"Support","email":"visawestern.com@gmail.com","sections":[["Contact us","Email: <b>visawestern.com@gmail.com</b> — we usually reply within 24 hours (UTC+7)."],["What you need to get started","SSH2VPN connects through <b>your own server</b> (a VPS you rent). You will need its IP address, SSH username and password. Any cheap VPS with SSH access works — DigitalOcean, Vultr, Hetzner, Hostinger and similar providers are all suitable."],["How to add your server","Open the app → <b>Add Server</b> → enter the IP, port (usually 22), username and password → tap <b>Test Connection</b> → save. You can also paste a line like <code>ssh user@1.2.3.4</code> and the app fills the fields automatically."],["Free time and the \"+3h\" button","Every install starts with 3 hours of free connection time. When it runs out, the <b>+3h free</b> button lets you watch a short ad to add 3 more hours (up to 12 hours banked). The button is visible only while the VPN is disconnected — it needs your real country for ad targeting, and through the tunnel your country would look wrong."],["The Unlimited upgrade","A one-time purchase removes the time limit and the ads forever. It is processed entirely by Apple — we never see your payment details. If you reinstall the app, use <b>Restore Purchase</b> in Settings."],["The app does not connect","Check that your server allows SSH password login and TCP forwarding (default on most VPS images). Verify the IP, port and password. Watch the in-app diagnostics while connecting — it shows exactly which step fails."],["Privacy","SSH2VPN collects nothing. Credentials stay in your iOS Keychain; the full policy ships inside the app and on this site."]]},
"ru":{"title":"Поддержка","updated":"SSH2VPN — свой VPS, свой VPN","footer":"Поддержка","email":"visawestern.com@gmail.com","sections":[["Связаться с нами","Почта: <b>visawestern.com@gmail.com</b> — обычно отвечаем в течение 24 часов (UTC+7)."],["Что нужно для начала","SSH2VPN подключается через <b>ваш собственный сервер</b> (арендуемый вами VPS). Нужны его IP-адрес, SSH-логин и пароль. Подойдёт любой дешёвый VPS с SSH — DigitalOcean, Vultr, Hetzner, Hostinger и подобные провайдеры."],["Как добавить сервер","Откройте приложение → <b>Добавить сервер</b> → введите IP, порт (обычно 22), логин и пароль → <b>Проверить соединение</b> → сохраните. Можно просто вставить строку вида <code>ssh user@1.2.3.4</code> — приложение заполнит поля само."],["Бесплатное время и кнопка «+3ч»","Каждая установка получает 3 часа бесплатного подключения. Когда время кончится, кнопка <b>+3ч бесплатно</b> предложит посмотреть короткую рекламу и добавить ещё 3 часа (до 12 часов в запасе). Кнопка видна только при выключенной VPN — рекламной сети нужна ваша настоящая страна, а через туннель она выглядит другой."],["Расширение «Безлимит»","Разовая покупба снимает лимит времени и убирает рекламу навсегда. Оплату полностью обрабатывает Apple — мы не видим ваших платёжных данных. После переустановки приложения используйте <b>Восстановить покупку</b> в настройках."],["Приложение не подключается","Проверьте, что сервер разрешает вход по паролю и TCP-форвардинг (по умолчанию включено на большинстве VPS). Проверьте IP, порт и пароль. Во время подключения смотрите встроенную диагностику — она показывает, на каком шаге сбой."],["Приватность","SSH2VPN ничего не собирает. Данные серверов хранятся в связке ключей iOS; полная политика — внутри приложения и на этом сайте."]]},
"es":{"title":"Soporte","updated":"SSH2VPN — tu VPS, tu VPN","footer":"Soporte","email":"visawestern.com@gmail.com","sections":[["Contáctanos","Correo: <b>visawestern.com@gmail.com</b> — solemos responder en 24 horas (UTC+7)."],["Qué necesitas para empezar","SSH2VPN se conecta a través de <b>tu propio servidor</b> (un VPS que alquilas). Necesitas su IP, usuario y contraseña SSH. Cualquier VPS barato con SSH sirve — DigitalOcean, Vultr, Hetzner, Hostinger y similares."],["Cómo añadir tu servidor","Abre la app → <b>Añadir servidor</b> → introduce IP, puerto (normalmente 22), usuario y contraseña → <b>Probar conexión</b> → guarda. También puedes pegar una línea como <code>ssh user@1.2.3.4</code> y la app rellena los campos."],["Tiempo gratis y el botón «+3h»","Cada instalación empieza con 3 horas de conexión gratis. Al agotarse, el botón <b>+3h gratis</b> ofrece un anuncio corto que añade 3 horas más (hasta 12 acumuladas). Solo aparece con la VPN desconectada — la red publicitaria necesita tu país real, y a través del túnel parecería otro."],["La mejora Ilimitado","Una compra única elimina el límite de tiempo y la publicidad para siempre. La gestiona Apple por completo — nunca vemos tus datos de pago. Si reinstalas la app, usa <b>Restaurar compra</b> en Ajustes."],["La app no conecta","Verifica que el servidor permite login SSH por contraseña y reenvío TCP (por defecto sí en la mayoría de imágenes VPS). Comprueba IP, puerto y contraseña. Mira el diagnóstico integrado durante la conexión — muestra el paso que falla."],["Privacidad","SSH2VPN no recopila nada. Las credenciales viven en tu llavero de iOS; la política completa está en la app y en este sitio."]]},
"de":{"title":"Support","updated":"SSH2VPN — dein VPS, dein VPN","footer":"Support","email":"visawestern.com@gmail.com","sections":[["Kontaktiere uns","E-Mail: <b>visawestern.com@gmail.com</b> — Antwort meist innerhalb von 24 Stunden (UTC+7)."],["Was du für den Start brauchst","SSH2VPN verbindet sich über <b>deinen eigenen Server</b> (einen gemieteten VPS). Du brauchst IP, SSH-Benutzer und Passwort. Jeder günstige VPS mit SSH funktioniert — DigitalOcean, Vultr, Hetzner, Hostinger und ähnliche."],["Server hinzufügen","App öffnen → <b>Server hinzufügen</b> → IP, Port (meist 22), Benutzer und Passwort eingeben → <b>Verbindung testen</b> → speichern. Du kannst auch eine Zeile wie <code>ssh user@1.2.3.4</code> einfügen — die App füllt alles aus."],["Gratis-Zeit und der „+3 Std.“-Button","Jede Installation startet mit 3 Stunden Gratis-Zeit. Danach fügt der Button <b>+3 Std. gratis</b> nach einer kurzen Werbung 3 weitere Stunden hinzu (bis zu 12 gespeichert). Der Button erscheint nur bei getrennter VPN — das Werbenetz braucht dein echtes Land, durch den Tunnel sähe es falsch aus."],["Das Unbegrenzt-Upgrade","Ein Einmalkauf entfernt Zeitlimit und Werbung für immer. Apple wickelt alles ab — wir sehen deine Zahlungsdaten nie. Nach Neuinstallation: <b>Kauf wiederherstellen</b> in den Einstellungen."],["Die App verbindet nicht","Prüfe, ob der Server SSH-Passwort-Login und TCP-Forwarding erlaubt (bei den meisten VPS-Images Standard). Kontrolliere IP, Port und Passwort. Die eingebaute Diagnose zeigt während des Verbindens genau den schiefgehenden Schritt."],["Datenschutz","SSH2VPN sammelt nichts. Zugangsdaten bleiben im iOS-Schlüsselbund; die vollständige Datenschutzerklärung liegt in der App und auf dieser Seite."]]},
"fr":{"title":"Assistance","updated":"SSH2VPN — votre VPS, votre VPN","footer":"Assistance","email":"visawestern.com@gmail.com","sections":[["Nous contacter","E-mail : <b>visawestern.com@gmail.com</b> — réponse généralement sous 24 h (UTC+7)."],["Ce qu'il faut pour commencer","SSH2VPN passe par <b>votre propre serveur</b> (un VPS que vous louez). Il vous faut son IP, son identifiant et son mot de passe SSH. Tout VPS bon marché avec SSH convient — DigitalOcean, Vultr, Hetzner, Hostinger et similaires."],["Ajouter votre serveur","Ouvrez l'app → <b>Ajouter un serveur</b> → saisissez IP, port (souvent 22), identifiant et mot de passe → <b>Tester la connexion</b> → enregistrez. Vous pouvez aussi coller une ligne du type <code>ssh user@1.2.3.4</code> — l'app remplit tout."],["Temps gratuit et le bouton « +3h »","Chaque installation démarre avec 3 heures de connexion gratuites. Une fois épuisées, le bouton <b>+3h gratuit</b> propose une courte pub qui ajoute 3 heures (jusqu'à 12 heures en réserve). Le bouton n'apparaît que VPN déconnecté — le réseau publicitaire a besoin de votre vrai pays, qui semblerait différent via le tunnel."],["L'upgrade Illimité","Un achat unique supprime la limite de temps et la pub pour toujours. Apple gère tout — nous ne voyons jamais vos données de paiement. Après réinstallation : <b>Restaurer l'achat</b> dans Réglages."],["L'app ne se connecte pas","Vérifiez que le serveur accepte le login SSH par mot de passe et le forwarding TCP (par défaut sur la plupart des images VPS). Contrôlez IP, port et mot de passe. Le diagnostic intégré montre pendant la connexion l'étape qui échoue."],["Confidentialité","SSH2VPN ne collecte rien. Les identifiants restent dans le trousseau iOS ; la politique complète est dans l'app et sur ce site."]]},
"it":{"title":"Assistenza","updated":"SSH2VPN — il tuo VPS, la tua VPN","footer":"Assistenza","email":"visawestern.com@gmail.com","sections":[["Contattaci","Email: <b>visawestern.com@gmail.com</b> — rispondiamo di solito entro 24 ore (UTC+7)."],["Cosa serve per iniziare","SSH2VPN si collega tramite <b>il tuo server</b> (un VPS che noleggi). Servono IP, utente e password SSH. Va bene qualsiasi VPS economico con SSH — DigitalOcean, Vultr, Hetzner, Hostinger e simili."],["Come aggiungere il server","Apri l'app → <b>Aggiungi server</b> → inserisci IP, porta (di solito 22), utente e password → <b>Testa connessione</b> → salva. Puoi anche incollare una riga tipo <code>ssh user@1.2.3.4</code> e l'app compila tutto."],["Tempo gratuito e il pulsante «+3h»","Ogni installazione parte con 3 ore di connessione gratuite. Quando finiscono, il pulsante <b>+3h gratis</b> propone una breve pubblicità che aggiunge 3 ore (fino a 12 in banca). Il pulsante appare solo a VPN scollegata — la rete pubblicitaria richiede il tuo paese reale, che attraverso il tunnel sembrerebbe un altro."],["L'upgrade Illimitato","Un acquisto una tantum elimina il limite di tempo e la pubblicità per sempre. È gestito interamente da Apple — non vediamo mai i tuoi dati di pagamento. Dopo una reinstallazione: <b>Ripristina acquisto</b> nelle Impostazioni."],["L'app non si collega","Verifica che il server consenta login SSH con password e inoltro TCP (predefinito sulla maggior parte delle immagini VPS). Controlla IP, porta e password. Il diagnostico integrato mostra durante la connessione il passaggio che fallisce."],["Privacy","SSH2VPN non raccoglie nulla. Le credenziali restano nel portachiavi iOS; la policy completa è nell'app e su questo sito."]]},
"pt":{"title":"Suporte","updated":"SSH2VPN — seu VPS, sua VPN","footer":"Suporte","email":"visawestern.com@gmail.com","sections":[["Fale conosco","E-mail: <b>visawestern.com@gmail.com</b> — normalmente respondemos em 24 horas (UTC+7)."],["O que você precisa para começar","O SSH2VPN conecta pelo <b>seu próprio servidor</b> (um VPS que você aluga). Você precisa do IP, usuário e senha SSH. Qualquer VPS barato com SSH serve — DigitalOcean, Vultr, Hetzner, Hostinger e parecidos."],["Como adicionar seu servidor","Abra o app → <b>Adicionar Servidor</b> → informe IP, porta (geralmente 22), usuário e senha → <b>Testar Conexão</b> → salve. Também dá para colar uma linha tipo <code>ssh user@1.2.3.4</code> e o app preenche tudo."],["Tempo grátis e o botão «+3h»","Cada instalação começa com 3 horas de conexão grátis. Quando acaba, o botão <b>+3h grátis</b> mostra um anúncio curto que adiciona 3 horas (até 12 acumuladas). O botão só aparece com a VPN desconectada — a rede de anúncios precisa do seu país real, que pelo túnel pareceria outro."],["O upgrade Ilimitado","Uma compra única remove o limite de tempo e os anúncios para sempre. Tudo é processado pela Apple — nunca vemos seus dados de pagamento. Se reinstalar o app, use <b>Restaurar Compra</b> nos Ajustes."],["O app não conecta","Verifique se o servidor aceita login SSH por senha e encaminhamento TCP (padrão na maioria das imagens VPS). Confira IP, porta e senha. O diagnóstico integrado mostra durante a conexão exatamente a etapa que falha."],["Privacidade","O SSH2VPN não coleta nada. As credenciais ficam no chaveiro do iOS; a política completa está no app e neste site."]]},
"ja":{"title":"サポート","updated":"SSH2VPN — あなたのVPS、あなたのVPN","footer":"サポート","email":"visawestern.com@gmail.com","sections":[["お問い合わせ","メール: <b>visawestern.com@gmail.com</b> — 通常24時間以内に返信します（UTC+7）。"],["はじめに必要なもの","SSH2VPNは<b>ご自身のサーバー</b>（レンタルしたVPS）経由で接続します。IPアドレス、SSHユーザー名、パスワードが必要です。SSHできる安価なVPSなら何でも構いません — DigitalOcean、Vultr、Hetzner、Hostingerなど。"],["サーバーの追加方法","アプリを開く → <b>サーバーを追加</b> → IP、ポート（通常22）、ユーザー名、パスワードを入力 → <b>接続テスト</b> → 保存。<code>ssh user@1.2.3.4</code> のような行を貼り付ければアプリが自動入力します。"],["無料時間と「+3時間」ボタン","インストールごとに3時間の無料接続時間が付きます。なくなると<b>+3時間無料</b>ボタンで短い広告を見て3時間追加できます（最大12時間まで貯蓄）。このボタンはVPN切断時のみ表示されます — 広告ネットワークは実際の国を必要とし、トンネル経由では別の国に見えるためです。"],["Unlimitedアップグレード","一回の購入で時間制限と広告が永久に解除されます。決済はすべてAppleが処理 — 支払い情報は一切見えません。再インストール後は設定の<b>購入を復元</b>を使ってください。"],["接続できない","サーバーがSSHパスワードログインとTCPフォワーディングを許可しているか確認してください（多くのVPSイメージではデフォルトで有効）。IP・ポート・パスワードを確認し、接続中の内蔵診断で失敗しているステップを特定できます。"],["プライバシー","SSH2VPNは何も収集しません。認証情報はiOSキーチェーンにのみ保存され、完全なポリシーはアプリ内と本サイトにあります。"]]},
"zh":{"title":"支持","updated":"SSH2VPN — 你的 VPS，你的 VPN","footer":"支持","email":"visawestern.com@gmail.com","sections":[["联系我们","邮箱：<b>visawestern.com@gmail.com</b> — 通常 24 小时内回复（UTC+7）。"],["开始使用需要什么","SSH2VPN 通过<b>你自己的服务器</b>（你租用的 VPS）连接。你需要它的 IP 地址、SSH 用户名和密码。任何支持 SSH 的廉价 VPS 都可以 — DigitalOcean、Vultr、Hetzner、Hostinger 等都可以。"],["如何添加服务器","打开应用 → <b>添加服务器</b> → 输入 IP、端口（通常是 22）、用户名和密码 → <b>测试连接</b> → 保存。也可以直接粘贴一行 <code>ssh user@1.2.3.4</code>，应用会自动填写。"],["免费时间与「+3小时」按钮","每次安装自带 3 小时免费连接时间。用完后，<b>+3小时免费</b>按钮可观看一段短广告来追加 3 小时（最多储备 12 小时）。该按钮仅在 VPN 断开时显示 — 广告网络需要你的真实国家，通过隧道会显示成别的国家。"],["Unlimited 升级","一次性购买永久解除时间限制并移除广告。全部由 Apple 处理 — 我们看不到你的付款信息。重新安装后，请在设置中使用<b>恢复购买</b>。"],["应用连不上","检查服务器是否允许 SSH 密码登录和 TCP 转发（多数 VPS 镜像默认开启）。核对 IP、端口和密码。连接时可查看内置诊断，它会显示具体失败在哪一步。"],["隐私","SSH2VPN 不收集任何数据。凭据只保存在 iOS 钥匙串中；完整政策见应用内和本网站。"]]},
"ko":{"title":"지원","updated":"SSH2VPN — 나의 VPS, 나의 VPN","footer":"지원","email":"visawestern.com@gmail.com","sections":[["문의하기","이메일: <b>visawestern.com@gmail.com</b> — 보통 24시간 이내에 답장합니다 (UTC+7)."],["시작하려면","SSH2VPN은 <b>직접 구매한 서버</b>(임대한 VPS)를 통해 연결됩니다. IP 주소, SSH 사용자 이름, 비밀번호가 필요합니다. SSH 접속이 되는 저렴한 VPS라면 무엇이든 됩니다 — DigitalOcean, Vultr, Hetzner, Hostinger 등."],["서버 추가 방법","앱 열기 → <b>서버 추가</b> → IP, 포트(보통 22), 사용자 이름, 비밀번호 입력 → <b>연결 테스트</b> → 저장. <code>ssh user@1.2.3.4</code> 형식의 한 줄을 붙여넣으면 앱이 자동으로 채워 넣습니다."],["무료 시간과 «+3시간» 버튼","설치마다 3시간의 무료 접속 시간이 주어집니다. 다 쓰면 <b>+3시간 무료</b> 버튼으로 짧은 광고를 보고 3시간을 더 추가할 수 있습니다(최대 12시간 적립). 이 버튼은 VPN이 꺼져 있을 때만 보입니다 — 광고 네트워크는 실제 국가가 필요하고, 터널을 통하면 다른 국가로 보이기 때문입니다."],["Unlimited 업그레이드","일회성 구매로 시간 제한과 광고가 영구적으로 제거됩니다. 결제는 전부 Apple이 처리합니다 — 결제 정보는 절대 보지 못합니다. 재설치 후에는 설정의 <b>구매 복원</b>을 사용하세요."],["앱이 연결되지 않아요","서버가 SSH 비밀번호 로그인과 TCP 포워딩을 허용하는지 확인하세요(대부분의 VPS 이미지에서 기본값). IP·포트·비밀번호를 점검하세요. 연결 중 내장 진단이 어느 단계에서 실패하는지 정확히 보여줍니다."],["개인정보","SSH2VPN은 아무것도 수집하지 않습니다. 자격 증명은 iOS 키체인에만 보관되며, 전체 정책은 앱 내와 이 사이트에 있습니다."]]},
"ar":{"title":"الدعم","updated":"SSH2VPN — خادمك، شبكتك الافتراضية","footer":"الدعم","email":"visawestern.com@gmail.com","sections":[["تواصل معنا","البريد الإلكتروني: <b>visawestern.com@gmail.com</b> — نرد عادة خلال 24 ساعة (UTC+7)."],["ما تحتاجه للبدء","يتصل SSH2VPN عبر <b>خادمك الخاص</b> (خادم VPS تستأجره). تحتاج إلى عنوان IP واسم مستخدم SSH وكلمة المرور. أي خادم VPS رخيص يدعم SSH يكفي — DigitalOcean أو Vultr أو Hetzner أو Hostinger وما شابهها."],["كيف تضيف خادمك","افتح التطبيق → <b>إضافة خادم</b> → أدخل IP والمنفذ (عادة 22) واسم المستخدم وكلمة المرور → <b>اختبار الاتصال</b> → حفظ. يمكنك أيضًا لصق سطر مثل <code>ssh user@1.2.3.4</code> وسيملأ التطبيق الحقول تلقائيًا."],["الوقت المجاني وزر «+3 ساعات»","كل تثبيت يبدأ بـ 3 ساعات من وقت الاتصال المجاني. عند نفادها، زر <b>+3 ساعات مجانًا</b> يعرض إعلانًا قصيرًا يضيف 3 ساعات (حتى 12 ساعة مخزنة). الزر يظهر فقط عند فصل VPN — تحتاج شبكة الإعلانات إلى بلدك الحقيقي، وعبر النفق يبدو بلدًا آخر."],["ترقية غير المحدود","شراء لمرة واحدة يزيل حد الوقت والإعلانات للأبد. تعالجه Apple بالكامل — لا نرى بيانات الدفع أبدًا. بعد إعادة التثبيت استخدم <b>استعادة الشراء</b> في الإعدادات."],["التطبيق لا يتصل","تأكد أن الخادم يسمح بتسجيل الدخول بكلمة مرور SSH وإعادة توجيه TCP (الافتراضي في معظم صور VPS). تحقق من IP والمنفذ وكلمة المرور. التشخيص المدمج يعرض أثناء الاتصال الخطوة التي تفشل بالضبط."],["الخصوصية","SSH2VPN لا يجمع شيئًا. بيانات الاعتماد تبقى في Keychain لـ iOS؛ السياسة الكاملة داخل التطبيق وعلى هذا الموقع."]]},
"hi":{"title":"सहायता","updated":"SSH2VPN — आपका VPS, आपका VPN","footer":"सहायता","email":"visawestern.com@gmail.com","sections":[["संपर्क करें","ईमेल: <b>visawestern.com@gmail.com</b> — आमतौर पर 24 घंटे में जवाब (UTC+7)।"],["शुरू करने के लिए क्या चाहिए","SSH2VPN <b>आपके अपने सर्वर</b> (आपके किराए पर लिए VPS) से जुड़ता है। IP पता, SSH यूज़रनेम और पासवर्ड चाहिए। SSH वाला कोई भी सस्ता VPS चलेगा — DigitalOcean, Vultr, Hetzner, Hostinger आदि।"],["सर्वर कैसे जोड़ें","ऐप खोलें → <b>सर्वर जोड़ें</b> → IP, पोर्ट (आमतौर पर 22), यूज़रनेम और पासवर्ड भरें → <b>कनेक्शन टेस्ट</b> → सेव करें। <code>ssh user@1.2.3.4</code> जैसी एक लाइन पेस्ट करें तो ऐप खुद भर देता है।"],["मुफ़्त समय और «+3 घंटे» बटन","हर इंस्टॉल पर 3 घंटे का मुफ़्त कनेक्शन मिलता है। खत्म होने पर <b>+3 घंटे मुफ़्त</b> बटन एक छोटा विज्ञापन दिखाकर 3 घंटे और जोड़ता है (अधिकतम 12 घंटे जमा)। बटन केवल VPN बंद होने पर दिखता है — विज्ञापन नेटवर्क को आपका असली देश चाहिए, टनल से वह दूसरा दिखता है।"],["Unlimited अपग्रेड","एक बार खरीदने से समय सीमा और विज्ञापन हमेशा के लिए हट जाते हैं। पूरा भुगतान Apple संभालता है — हम आपकी पेमेंट जानकारी कभी नहीं देखते। दोबारा इंस्टॉल पर सेटिंग्स में <b>खरीद पुनर्स्थापित</b> करें।"],["ऐप कनेक्ट नहीं होता","जाँचें कि सर्वर SSH पासवर्ड लॉगिन और TCP फॉरवर्डिंग की अनुमति देता हो (ज़्यादातर VPS इमेज में डिफ़ॉल्ट)। IP, पोर्ट और पासवर्ड जाँचें। कनेक्ट होते समय इन-ऐप डायग्नोस्टिक्स दिखाता है कि कौन-सा कदम फेल हो रहा है।"],["प्राइवेसी","SSH2VPN कुछ भी एकत्र नहीं करता। क्रेडेंशियल iOS Keychain में रहते हैं; पूरी नीति ऐप के अंदर और इस साइट पर है।"]]},
"th":{"title":"การสนับสนุน","updated":"SSH2VPN — VPS ของคุณ VPN ของคุณ","footer":"การสนับสนุน","email":"visawestern.com@gmail.com","sections":[["ติดต่อเรา","อีเมล: <b>visawestern.com@gmail.com</b> — ตอบกลับภายใน 24 ชั่วโมง (UTC+7)"],["เริ่มต้นต้องมีอะไร","SSH2VPN เชื่อมต่อผ่าน<b>เซิร์ฟเวอร์ของคุณเอง</b> (VPS ที่คุณเช่า) ต้องมี IP, ชื่อผู้ใช้ SSH และรหัสผ่าน VPS ราคาถูกที่ SSH ได้ทุกตัวใช้ได้ — DigitalOcean, Vultr, Hetzner, Hostinger ฯลฯ"],["วิธีเพิ่มเซิร์ฟเวอร์","เปิดแอป → <b>เพิ่มเซิร์ฟเวอร์</b> → กรอก IP, พอร์ต (ปกติ 22), ชื่อผู้ใช้, รหัสผ่าน → <b>ทดสอบการเชื่อมต่อ</b> → บันทึก แปะบรรทัดแบบ <code>ssh user@1.2.3.4</code> แอปจะกรอกให้เอง"],["เวลาฟรีและปุ่ม «+3 ชม.»","ทุกการติดตั้งได้ 3 ชั่วโมงเวลาเชื่อมต่อฟรี เมื่อหมด ปุ่ม <b>+3 ชม. ฟรี</b> ให้ดูโฆษณาสั้น ๆ แล้วเพิ่มอีก 3 ชั่วโมง (สะสมได้ถึง 12 ชม.) ปุ่มแสดงเฉพาะเมื่อปิด VPN — เครือข่ายโฆษณาต้องการประเทศจริงของคุณ ผ่านอุโมงค์จะดูเป็นประเทศอื่น"],["อัปเกรดไม่จำกัด","จ่ายครั้งเดียว ลบขีดจำกัดเวลาและโฆษณาถาวร ดำเนินการโดย Apple ทั้งหมด — เราไม่เห็นข้อมูลการชำระเงิน หากติดตั้งใหม่ ใช้ <b>คืนค่าการซื้อ</b> ในการตั้งค่า"],["แอปเชื่อมต่อไม่ได้","ตรวจว่าเซิร์ฟเวอร์อนุญาต SSH แบบรหัสผ่านและ TCP forwarding (ค่าเริ่มต้นใน VPS ส่วนใหญ่) ตรวจ IP, พอร์ต, รหัสผ่าน การวินิจฉัยในแอปจะบอกขั้นตอนที่ล้มเหลว"],["ความเป็นส่วนตัว","SSH2VPN ไม่เก็บอะไรเลย ข้อมูลเข้าสู่ระบบอยู่ใน Keychain ของ iOS นโยบายฉบับเต็มอยู่ในแอปและบนเว็บไซต์นี้"]]},
"tr":{"title":"Destek","updated":"SSH2VPN — kendi VPS'in, kendi VPN'in","footer":"Destek","email":"visawestern.com@gmail.com","sections":[["Bize ulaşın","E-posta: <b>visawestern.com@gmail.com</b> — genellikle 24 saat içinde yanıt (UTC+7)."],["Başlamak için gereken","SSH2VPN <b>kendi sunucun</b> üzerinden bağlanır (kiraladığın bir VPS). IP adresi, SSH kullanıcı adı ve parola gerekir. SSH destekleyen her ucuz VPS olur — DigitalOcean, Vultr, Hetzner, Hostinger vb."],["Sunucu nasıl eklenir","Uygulamayı aç → <b>Sunucu Ekle</b> → IP, port (genellikle 22), kullanıcı adı ve parolayı gir → <b>Bağlantıyı Test Et</b> → kaydet. <code>ssh user@1.2.3.4</code> gibi bir satır yapıştırman yeterli — uygulama doldurur."],["Ücretsiz süre ve «+3 saat» düğmesi","Her kurulum 3 saat ücretsiz bağlantıyla başlar. Süre bitince <b>+3 saat ücretsiz</b> düğmesi kısa bir reklam izleyerek 3 saat daha ekler (12 saate kadar birikir). Düğme yalnızca VPN kapalıyken görünür — reklam ağı gerçek ülkeni ister, tünelden bakınca farklı görünür."],["Sınırsız yükseltmesi","Tek seferlik alışveriş süre limitini ve reklamları sonsuza dek kaldırır. Ödemeyi tamamen Apple işler — ödeme bilgilerini asla görmeyiz. Yeniden kurulumda Ayarlar'dan <b>Satın Almayı Geri Yükle</b>."],["Uygulama bağlanmıyor","Sunucunun SSH parola girişine ve TCP yönlendirmeye izin verdiğini kontrol et (çoğu VPS imajında varsayılan). IP, port ve parolayı doğrula. Bağlanırken yerleşik teşhis tam olarak hangi adımın çöktüğünü gösterir."],["Gizlilik","SSH2VPN hiçbir şey toplamaz. Kimlik bilgileri iOS anahtarlığında kalır; tam politika uygulamanın içinde ve bu sitede."]]},
"pl":{"title":"Pomoc","updated":"SSH2VPN — twój VPS, twoje VPN","footer":"Pomoc","email":"visawestern.com@gmail.com","sections":[["Skontaktuj się z nami","E-mail: <b>visawestern.com@gmail.com</b> — odpowiadamy zwykle w 24 godziny (UTC+7)."],["Co potrzebne na start","SSH2VPN łączy się przez <b>twój własny serwer</b> (wynajęty VPS). Potrzebujesz adresu IP, użytkownika SSH i hasła. Pasuje każdy tani VPS z SSH — DigitalOcean, Vultr, Hetzner, Hostinger i podobne."],["Jak dodać serwer","Otwórz aplikację → <b>Dodaj serwer</b> → wpisz IP, port (zwykle 22), użytkownika i hasło → <b>Testuj połączenie</b> → zapisz. Możesz też wkleić linię <code>ssh user@1.2.3.4</code> — aplikacja wypełni pola sama."],["Darmowy czas i przycisk «+3 godz.»","Każda instalacja zaczyna się od 3 godzin darmowego połączenia. Gdy się skończą, przycisk <b>+3 godz. za darmo</b> po krótkiej reklamie dodaje 3 godziny (do 12 w zapasie). Przycisk widać tylko przy rozłączonej VPN — sieć reklamowa potrzebuje twojego prawdziwego kraju, a przez tunel wygląda on inaczej."],["Rozszerzenie Bez limitu","Jednorazowy zakup usuwa limit czasu i reklamy na zawsze. Całość obsługuje Apple — nigdy nie widzimy twoich danych płatności. Po ponownej instalacji użyj <b>Przywróć zakup</b> w Ustawieniach."],["Aplikacja się nie łączy","Sprawdź, czy serwer pozwala na logowanie SSH hasłem i przekazywanie TCP (domyślne w większości obrazów VPS). Zweryfikuj IP, port i hasło. Wbudowana diagnostyka pokaże podczas łączenia, który krok zawodzi."],["Prywatność","SSH2VPN niczego nie zbiera. Dane logowania trzymają się w pęku kluczy iOS; pełna polityka jest w aplikacji i na tej stronie."]]},
"nl":{"title":"Ondersteuning","updated":"SSH2VPN — jouw VPS, jouw VPN","footer":"Ondersteuning","email":"visawestern.com@gmail.com","sections":[["Neem contact op","E-mail: <b>visawestern.com@gmail.com</b> — meestal antwoord binnen 24 uur (UTC+7)."],["Wat je nodig hebt om te beginnen","SSH2VPN verbindt via <b>je eigen server</b> (een VPS die je huurt). Je hebt het IP-adres, de SSH-gebruikersnaam en het wachtwoord nodig. Elke goedkope VPS met SSH werkt — DigitalOcean, Vultr, Hetzner, Hostinger en dergelijke."],["Server toevoegen","Open de app → <b>Server toevoegen</b> → vul IP, poort (meestal 22), gebruikersnaam en wachtwoord in → <b>Verbinding testen</b> → bewaar. Je kunt ook een regel zoals <code>ssh user@1.2.3.4</code> plakken en de app vult alles in."],["Gratis tijd en de «+3 uur»-knop","Elke installatie begint met 3 uur gratis verbindingstijd. Zodra dat op is, voegt de knop <b>+3 uur gratis</b> na een korte advertentie 3 uur toe (tot 12 uur in voorraad). De knop is alleen zichtbaar wanneer de VPN is losgekoppeld — het advertentienetwerk heeft je echte land nodig, en door de tunnel lijkt het een ander."],["De Onbeperkt-upgrade","Een eenmalige aankoop verwijdert het tijdslimiet en de advertenties voorgoed. Apple verwerkt alles — wij zien je betaalgegevens nooit. Na herinstallatie: <b>Aankoop herstellen</b> in Instellingen."],["De app verbindt niet","Controleer of je server SSH-wachtwoordlogin en TCP-forwarding toestaat (standaard bij de meeste VPS-images). Verifieer IP, poort en wachtwoord. De ingebouwde diagnose toont tijdens het verbinden precies welke stap faalt."],["Privacy","SSH2VPN verzamelt niets. Inloggegevens blijven in de iOS-sleutelhanger; het volledige beleid staat in de app en op deze site."]]},
"vi":{"title":"Hỗ trợ","updated":"SSH2VPN — VPS của bạn, VPN của bạn","footer":"Hỗ trợ","email":"visawestern.com@gmail.com","sections":[["Liên hệ","Email: <b>visawestern.com@gmail.com</b> — thường trả lời trong 24 giờ (UTC+7)."],["Cần gì để bắt đầu","SSH2VPN kết nối qua <b>server riêng của bạn</b> (VPS bạn thuê). Cần địa chỉ IP, tên đăng nhập SSH và mật khẩu. Bất kỳ VPS rẻ nào có SSH đều dùng được — DigitalOcean, Vultr, Hetzner, Hostinger v.v."],["Cách thêm máy chủ","Mở ứng dụng → <b>Thêm máy chủ</b> → nhập IP, cổng (thường 22), tên đăng nhập, mật khẩu → <b>Kiểm tra kết nối</b> → lưu. Cũng có thể dán dòng <code>ssh user@1.2.3.4</code>, ứng dụng tự điền."],["Thời gian miễn phí và nút «+3 giờ»","Mỗi lần cài đặt có 3 giờ kết nối miễn phí. Hết thì nút <b>+3 giờ miễn phí</b> cho xem quảng cáo ngắn để cộng thêm 3 giờ (tối đa 12 giờ tích lũy). Nút chỉ hiện khi VPN đang tắt — mạng quảng cáo cần quốc gia thật của bạn, qua đường hầm sẽ trông như quốc gia khác."],["Nâng cấp Không giới hạn","Mua một lần bỏ vĩnh viễn giới hạn thời gian và quảng cáo. Apple xử lý toàn bộ — chúng tôi không thấy thông tin thanh toán. Cài lại thì dùng <b>Khôi phục mua hàng</b> trong Cài đặt."],["Ứng dụng không kết nối","Kiểm tra server có cho đăng nhập SSH bằng mật khẩu và TCP forwarding (mặc định ở đa số image VPS). Xác minh IP, cổng, mật khẩu. Chẩn đoán tích hợp sẽ chỉ đúng bước nào lỗi khi đang kết nối."],["Riêng tư","SSH2VPN không thu thập gì. Thông tin đăng nhập nằm trong Keychain iOS; chính sách đầy đủ có trong ứng dụng và trên site này."]]}

const FLAGS = {en:"\u{1F1EC}\u{1F1E7}",es:"\u{1F1EA}\u{1F1F8}",de:"\u{1F1E9}\u{1F1EA}",fr:"\u{1F1EB}\u{1F1F0}",it:"\u{1F1EE}\u{1F1F9}",pt:"\u{1F1E7}\u{1F1F7}",ja:"\u{1F1EF}\u{1F1F5}",zh:"\u{1F1E8}\u{1F1F3}",ko:"\u{1F1F0}\u{1F1F7}",ar:"\u{1F1F8}\u{1F1E6}",hi:"\u{1F1EE}\u{1F1F3}",th:"\u{1F1F9}\u{1F1ED}",tr:"\u{1F1F9}\u{1F1F7}",pl:"\u{1F1F5}\u{1F1F1}",nl:"\u{1F1F3}\u{1F1F1}",vi:"\u{1F1FB}\u{1F1F3}",ru:"\u{1F1F7}\u{1F1FA}"};
const NAMES = {en:"English",es:"Espa\u00f1ol",de:"Deutsch",fr:"Fran\u00e7ais",it:"Italiano",pt:"Portugu\u00eas",ja:"\u65e5\u672c\u8a9e",zh:"\u7b80\u4f53\u4e2d\u6587",ko:"\ud55c\uad6d\uc5b4",ar:"\u0627\u0644\u0639\u0631\u0628\u064a\u0629",hi:"\u0939\u093f\u0928\u094d\u0926\u0940",th:"\u0e44\u0e17\u0e22",tr:"T\u00fcrk\u00e7e",pl:"Polski",nl:"Nederlands",vi:"Ti\u1ebfng Vi\u1ec7t",ru:"\u0420\u0443\u0441\u0441\u043a\u0438\u0439"};
// Russian stays last (owner's decision); the browser language picks the default.
const ORDER = ["en","es","de","fr","it","pt","ja","zh","ko","ar","hi","th","tr","pl","nl","vi","ru"];
let cur = (localStorage.getItem("ssh2vpn_lang") || navigator.language || "en");
if (!T[cur] || typeof T[cur] !== "object") {
  const l = String(cur).toLowerCase().split("-")[0];
  const map = {"pt":"pt","zh":"zh","ja":"ja","ko":"ko","ar":"ar","hi":"hi","th":"th","tr":"tr","pl":"pl","nl":"nl","vi":"vi"};
  cur = map[l] || "en";
}
function apply(){
  const sel = document.getElementById("lang");
  if (sel && sel.value) { cur = sel.value; }
  try { localStorage.setItem("ssh2vpn_lang", cur); } catch(e) {}
  const t = (typeof T[cur] === "object") ? T[cur] : T.en;
  document.getElementById("t-title").textContent = t.title;
  document.getElementById("t-updated").textContent = t.updated;
  document.getElementById("t-footer").textContent = t.footer;
  document.getElementById("body").innerHTML = t.sections.map(function(x,i){
    return "<section><h2><span class='n'>"+(i+1)+"</span>"+x[0]+"</h2><p>"+x[1]+"</p></section>";
  }).join("");
}
(function init(){
  const sel = document.getElementById("lang");
  for (const k of ORDER) {
    const o = document.createElement("option");
    o.value = k; o.textContent = (FLAGS[k]||"") + " " + NAMES[k];
    sel.appendChild(o);
  }
  sel.value = cur;
  apply();
})();
</script>
