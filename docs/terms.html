"ja":{"title":"利用規約","updated":"最終更新：2026年9月","footer":"利用規約","s":[["同意","SSH2VPNをダウンロードして利用することで、本規約に同意したものとみなされます。同意しない場合はアプリを使用しないでください。"],["アプリの位置づけ","SSH2VPNは、標準のiOS VPNプロファイルを介してSSH2プロトコルで、あなた自身が用意したサーバーに端末を接続するクライアントです。当社はサーバーを提供・運営・管理していません。サーバーへのアクセス権を正当に持つことと、プロバイダーの利用規約を守ることはあなたの責任です。"],["利用者の責任","SSH2VPNは自己責任でご利用ください。アプリを合法的な目的のためのみ、適用法令および接続するネットワークやサービスの規則に従って使用することに同意します。"],["購入","オプションの「無制限」アップグレードは、App Storeの標準規約に基づきAppleが処理する一回のアプリ内購入です。返金はAppleのポリシーに従って処理されます。購入が返金・失効された場合、無制限の機能は削除されます。"],["無料プランと広告","無料プランは限られた接続時間を提供し、任意のリワード広告を視聴することで延長できます。広告と無料時間の提供は保証されず、変更される場合があります。"],["保証の排除","本アプリは「現状有姿」で提供され、いかなる保証もありません。中断のない・エラーのない動作や、すべてのサーバー・ネットワーク構成での動作を保証するものではありません。"],["責任の制限","法律で許される最大限の範囲において、当社はアプリの使用や、あなたが運用・依存しているサーバーの停止に起因する損害、データ損失、損失について責任を負いません。"],["変更","本規約はアプリの更新に伴い変更されることがあります。更新後も使用を続けた場合、変更後の規約に同意したものとみなされます。"],["お問い合わせ","ご質問はApp Storeの商品ページからご連絡ください。"]]},
"zh":{"title":"使用条款","updated":"最后更新：2026年9月","footer":"使用条款","s":[["接受","下载并使用 SSH2VPN 即表示您同意本使用条款。如不同意，请勿使用本应用。"],["应用性质","SSH2VPN 是一款通过标准 iOS VPN 配置文件、以 SSH2 协议将您的设备连接到您自行提供的服务器的客户端。我们不提供、运营或控制任何服务器。您有责任确保合法访问您的服务器，并遵守您服务商的条款。"],["您的责任","您需自担风险使用 SSH2VPN。您同意仅将本应用用于合法目的，并遵守所有适用法律以及您所连接的任何网络或服务的规则。"],["购买","可选的「不限量」升级是由 Apple 按照其 App Store 标准条款处理的一次性应用内购买。退款由 Apple 根据其政策处理。若购买被退款或撤销，「不限量」功能将被移除。"],["免费套餐与广告","免费套餐提供有限的连接时长，可通过观看可选的激励广告延长。广告和免费时长的可用性不作保证，且可能变更。"],["免责声明","本应用按「现状」提供，不提供任何形式的保证。我们不保证运行不中断、无错误，也不保证与所有服务器或网络配置兼容。"],["责任限制","在法律允许的最大范围内，对于因使用本应用或您运营或依赖的服务器停机而造成的损害、数据丢失或损失，我们不承担责任。"],["变更","这些条款可能随应用更新而变更。更新后继续使用即表示您接受更新后的条款。"],["联系方式","有疑问？请通过 App Store 产品页与我们联系。"]]},
"ko":{"title":"이용약관","updated":"마지막 업데이트: 2026년 9월","footer":"이용약관","s":[["동의","SSH2VPN을 다운로드하고 사용함으로써 본 약관에 동의합니다. 동의하지 않으면 앱을 사용하지 마세요."],["앱의 성격","SSH2VPN은 표준 iOS VPN 프로필을 통해 SSH2 프로토콜으로 사용자가 직접 제공하는 서버에 기기를 연결하는 클라이언트입니다. 우리는 어떤 서버도 제공·운영·통제하지 않습니다. 서버에 대한 합법적인 접근 권한 보유와 제공업체의 약관 준수는 사용자의 책임입니다."],["사용자 책임","SSH2VPN은 사용자 자신의 책임하에 사용합니다. 앱을 합법적인 목적으로만, 그리고 적용 법률과 연결하는 네트워크·서비스의 규칙에 따라 사용하는 데 동의합니다."],["구매","선택적 '무제한' 업그레이드는 App Store 표준 약관에 따라 Apple이 처리하는 일회성 인앱 구매입니다. 환불은 Apple의 정책에 따라 처리됩니다. 구매가 환불 또는 취소되면 무제한 기능은 제거됩니다."],["무료 플랜과 광고","무료 픐랜은 제한된 연결 시간을 제공하며 선택적 보상형 광고 시청으로 연장할 수 있습니다. 광고와 무료 시간의 제공은 보장되지 않으며 변경될 수 있습니다."],["보증 부인","본 앱은 '있는 그대로' 제공되며 어떠한 보증도 없습니다. 중단 없는·오류 없는 작동, 모든 서버나 네트워크 구성과의 호환성을 보장하지 않습니다."],["책임 제한","법률이 허용하는 최대 범위 내에서, 당사는 앱 사용이나 사용자가 운영·의존하는 서버의 중단으로 인한 손해, 데이터 손실, 손실에 대해 책임지지 않습니다."],["변경","본 약관은 앱 업데이트와 함께 변경될 수 있습니다. 업데이트 후 계속 사용하면 변경된 약관에 동의한 것으로 간주됩니다."],["연락","궁금한 점은 App Store 제품 페이지에서 문의하세요."]]},
"ar":{"title":"شروط الاستخدام","updated":"آخر تحديث: سبتمبر 2026","footer":"شروط الاستخدام","s":[["القبول","بتنزيل SSH2VPN واستخدامه فإنك توافق على شروط الاستخدام هذه. إذا لم توافق، فلا تستخدم التطبيق."],["ما هو التطبيق","SSH2VPN عميل يوصّل جهازك بخادم توفره أنت بنفسك عبر بروتوكول SSH2 باستخدام ملف VPN قياسي في iOS. نحن لا نوفر أي خوادم ولا نشغّلها ولا نتحكم فيها. أنت مسؤول عن امتلاكك الحق القانوني في الوصول إلى خادمك وعن الالتزام بشروط مزود الخدمة لديك."],["مسؤولياتك","أنت تستخدم SSH2VPN على مسؤوليتك الخاصة. توافق على استخدام التطبيق للأغراض المشروعة فقط وبما يتوافق مع القوانين المعمول بها وقواعد أي شبكة أو خدمة تتصل بها."],["المشتريات","ترقية «غير المحدود» الاختيارية هي شراء مدمج لمرة واحدة تعالجه Apple وفق الشروط القياسية لمتجر App Store. تُدار المبالغ المستردة وفق سياسات Apple. إذا تم رد المبلغ أو إلغاء الشراء، تُزال ميزات غير المحدود."],["الخطة المجانية والإعلانات","تمنح الخطة المجانية وقت اتصال محدودًا يمكن تمديده بمشاهدة إعلانات مكافأة اختيارية. لا يُضمن توفر الإعلانات والوقت المجاني وقد يتغير."],["عدم الضمان","يُقدم التطبيق \"كما هو\" دون أي ضمان. لا نضمن تشغيلًا متواصلًا أو خاليًا من الأخطاء، ولا التوافق مع كل خادم أو إعداد شبكة."],["المسؤولية","إلى أقصى حد يسمح به القانون، لا نتحمل المسؤولية عن أي أضرار أو فقدان بيانات أو خسائر ناتجة عن استخدامك للتطبيق أو توقف الخوادم التي تشغّلها أو تعتمد عليها."],["التغييرات","قد تتغير هذه الشروط مع تحديثات التطبيق. استمرار الاستخدام بعد التحديث يعني قبولك الشروط المحدثة."],["التواصل","أسئلة؟ تواصل معنا من صفحة المنتج في App Store."]]},
"hi":{"title":"उपयोग की शर्तें","updated":"अंतिम अपडेट: सितंबर 2026","footer":"उपयोग की शर्तें","s":[["स्वीकृति","SSH2VPN डाउनलोड करके उपयोग करने से आप इन उपयोग शर्तों से सहमत होते हैं। यदि सहमत नहीं हैं, तो ऐप का उपयोग न करें।"],["ऐप क्या है","SSH2VPN एक क्लाइंट है जो मानक iOS VPN प्रोफ़ाइल के माध्यम से SSH2 प्रोटोकॉल द्वारा आपके डिवाइस को उस सर्वर से जोड़ता है जो आप स्वयं प्रदान करते हैं। हम कोई सर्वर प्रदान, संचालित या नियंत्रित नहीं करते। अपने सर्वर तक कानूनी पहुँच रखना और अपने प्रदाता की शर्तों का पालन करना आपकी ज़िम्मेदारी है।"],["आपकी ज़िम्मेदारियाँ","आप SSH2VPN का उपयोग अपने जोखिम पर करते हैं। आप सहमत होते हैं कि ऐप का उपयोग केवल वैध उद्देश्यों के लिए और सभी लागू कानूनों तथा जिन नेटवर्क या सेवाओं से आप जुड़ते हैं उनके नियमों के अनुसार किया जाए।"],["खरीद","वैकल्पिक 'असीमित' अपग्रेड Apple द्वारा App Store की मानक शर्तों के तहत संसाधित एक बार का इन-ऐप खरीद है। रिफंड Apple की नीतियों के अनुसार संभाले जाते हैं। यदि खरीद वापस या रद्द की जाती है, तो असीमित सुविधाएँ हटा दी जाती हैं।"],["मुफ़्त प्लान और विज्ञापन","मुफ़्त प्लान सीमित कनेक्शन समय देता है जिसे वैकल्पिक रिवॉर्ड विज्ञापन देखकर बढ़ाया जा सकता है। विज्ञापनों और मुफ़्त समय की उपलब्धता की गारंटी नहीं है और यह बदल सकता है।"],["वारंटी का अभाव","ऐप \"जैसा है\" दिया जाता है, बिना किसी प्रकार की वारंटी के। हम निर्बाध या त्रुटि-रहित संचालन, या हर सर्वर और नेटवर्क कॉन्फ़िगरेशन के साथ संगतता की गारंटी नहीं देते।"],["दायित्व","कानून द्वारा अनुमत सीमा तक, हम ऐप के उपयोग या आपके द्वारा संचालित या निर्भर सर्वरों के डाउनटाइम से उत्पन्न किसी भी क्षति, डेटा हानि या नुकसान के लिए उत्तरदायी नहीं हैं।"],["परिवर्तन","ये शर्तें ऐप अपडेट के साथ बदल सकती हैं। अपडेट के बाद निरंतर उपयोग का अर्थ है कि आप अपडेट की गई शर्तों से सहमत हैं।"],["संपर्क","प्रश्न? App Store उत्पाद पेज से हमसे संपर्क करें।"]]},
"th":{"title":"ข้อกำหนดการใช้งาน","updated":"อัปเดตล่าสุด: กันยายน 2026","footer":"ข้อกำหนดการใช้งาน","s":[["การยอมรับ","การดาวน์โหลดและใช้ SSH2VPN ถือว่าคุณยอมรับข้อกำหนดเหล่านี้ หากไม่ยอมรับ โปรดอย่าใช้แอป"],["แอปคืออะไร","SSH2VPN เป็นไคลเอนต์ที่เชื่อมต่ออุปกรณ์ของคุณเข้ากับเซิร์ฟเวอร์ที่คุณจัดหาเอง ผ่านโปรโตคอล SSH2 บนโปรไฟล์ VPN มาตรฐานของ iOS เราไม่ได้ให้บริการ ดำเนินการ หรือควบคุมเซิร์ฟเวอร์ใดๆ คุณมีหน้าที่รับผิดชอบในการมีสิทธิ์ตามกฎหมายในการเข้าถึงเซิร์ฟเวอร์ของคุณ และปฏิบัติตามเงื่อนไขของผู้ให้บริการ"],["ความรับผิดชอบของคุณ","คุณใช้ SSH2VPN โดยยอมรับความเสี่ยงเอง คุณตกลงที่จะใช้แอปเพื่อวัตถุประสงค์ที่ชอบด้วยกฎหมายเท่านั้น และปฏิบัติตามกฎหมายที่ใช้บังคับและกฎของเครือข่ายหรือบริการใดๆ ที่คุณเชื่อมต่อ"],["การซื้อ","การอัปเกรด 'ไม่จำกัด' ที่เป็นทางเลือกคือการซื้อในแอปครั้งเดียวที่ Apple ดำเนินการตามเงื่อนไขมาตรฐานของ App Store การคืนเงินดำเนินการโดย Apple ตามนโยบายของพวกเขา หากการซื้อถูกคืนเงินหรือเพิกถอน ฟีเจอร์ไม่จำกัดจะถูกลบ"],["แพ็กเกจฟรีและโฆษณา","แพ็กเกจฟรีให้เวลาเชื่อมต่อจำกัด ซึ่งขยายได้ด้วยการดูโฆษณาที่ให้รางวัล (ไม่บังคับ) ความพร้อมของโฆษณาและเวลาฟรีไม่รับประกันและอาจเปลี่ยนแปลง"],["ไม่มีการรับประกัน","แอปให้บริการ \"ตามสภาพ\" โดยไม่มีการรับประกันใดๆ เราไม่รับประกันการทำงานต่อเนื่องหรือปราศจากข้อผิดพลาด หรือความเข้ากันได้กับทุกเซิร์ฟเวอร์หรือการตั้งค่าเครือข่าย"],["ความรับผิด","ในขอบเขตที่กฎหมายอนุญาต เราไม่รับผิดต่อความเสียหาย การสูญหายของข้อมูล หรือความสูญเสียที่เกิดจากการใช้แอป หรือการหยุดทำงานของเซิร์ฟเวอร์ที่คุณดำเนินการหรือพึ่งพา"],["การเปลี่ยนแปลง","ข้อกำหนดเหล่านี้อาจเปลี่ยนไปพร้อมการอัปเดตแอป การใช้งานต่อเนื่องหลังอัปเดตถือว่ายอมรับข้อกำหนดที่อัปเดต"],["ติดต่อ","มีคำถาม? ติดต่อเราจากหน้าผลิตภัณฑ์ใน App Store"]]},
"tr":{"title":"Kullanım Koşulları","updated":"Son güncelleme: Eylül 2026","footer":"Kullanım Koşulları","s":[["Kabul","SSH2VPN'ı indirip kullanarak bu Kullanım Koşulları'nı kabul etmiş olursunuz. Kabul etmiyorsanız uygulamayı kullanmayın."],["Uygulama nedir","SSH2VPN, standart bir iOS VPN profili üzerinden SSH2 protokolüyle cihazını, senin kendi sağladığın bir sunucuya bağlayan bir istemcidir. Biz hiçbir sunucu sağlamıyor, işletmiyor ve kontrol etmiyoruz. Sunucuna yasal erişim hakkına sahip olmak ve sağlayıcının koşullarına uymak senin sorumluluğundadır."],["Sorumlulukların","SSH2VPN'ı kendi riskin altında kullanırsın. Uygulamayı yalnızca yasal amaçlarla, geçerli yasalara ve bağlandığın herhangi bir ağ veya hizmetin kurallarına uygun olarak kullanmayı kabul edersin."],["Satın almalar","İsteğe bağlı Sınırsız yükseltmesi, Apple'ın standart App Store koşulları kapsamında işlenen tek seferlik bir uygulama içi satın almadır. İadeler Apple'ın politikalarına göre yönetilir. Bir satın alma iade edilir veya iptal edilirse Sınırsız özellikleri kaldırılır."],["Ücretsiz plan ve reklamlar","Ücretsiz plan, isteğe bağlı ödüllü reklamlar izlenerek uzatılabilen sınırlı bağlantı süresi sunar. Reklamların ve ücretsiz sürenin kullanılabilirliği garanti edilmez ve değişebilir."],["Garanti yok","Uygulama \"olduğu gibi\", hiçbir garanti olmadan sunulur. Kesintisiz veya hatasız çalışmayı, her sunucu ve ağ yapılandırmasıyla uyumluluğu garanti etmiyoruz."],["Sorumluluk","Yasanın izin verdiği en üst düzeye kadar, uygulamanın kullanımından ya da işlettiğin veya bağımlı olduğun sunucuların kesintisinden kaynaklanan hasarlardan, veri kayıplarından veya zararlardan sorumlu değiliz."],["Değişiklikler","Bu koşullar uygulama güncellemeleriyle değişebilir. Güncellemeden sonra kullanmaya devam etmek, güncellenmiş koşulları kabul etmek anlamına gelir."],["İletişim","Sorularınız mı var? App Store ürün sayfasından bize ulaşın."]]},
"pl":{"title":"Warunki Użytkowania","updated":"Ostatnia aktualizacja: wrzesień 2026","footer":"Warunki Użytkowania","s":[["Akceptacja","Pobierając i korzystając z SSH2VPN akceptujesz te Warunki Użytkowania. Jeśli się nie zgadzasz, nie korzystaj z aplikacji."],["Czym jest aplikacja","SSH2VPN to klient, który łączy Twoje urządzenie z serwerem, który sam zapewniasz, przez protokół SSH2 na standardowym profilu VPN iOS. Nie dostarczamy, nie prowadzimy i nie kontrolujemy żadnych serwerów. Odpowiadasz za posiadanie prawnego prawa dostępu do swojego serwera i przestrzeganie warunków swojego dostawcy."],["Twoja odpowiedzialność","Korzystasz z SSH2VPN na własne ryzyko. Zgadzasz się używać aplikacji wyłącznie w zgodnych z prawem celach, zgodnie z obowiązującymi przepisami oraz zasadami każdej sieci lub usługi, z którą się łączysz."],["Zakupy","Opcjonalne rozszerzenie Bez limitu to jednorazowy zakup w aplikacji realizowany przez Apple na warunkach standardowych App Store. Zwrotami zajmuje się Apple zgodnie ze swoimi politykami. Jeśli zakup zostanie zwrócony lub cofnięty, funkcje Bez limitu zostają usunięte."],["Darmowy plan i reklamy","Darmowy plan zapewnia ograniczony czas połączenia, który można wydłużyć oglądając opcjonalne reklamy z nagrodą. Dostępność reklam i darmowego czasu nie jest gwarantowana i może się zmienić."],["Brak gwarancji","Aplikacja jest dostarczana \"w stanie takim, w jakim jest\", bez żadnych gwarancji. Nie gwarantujemy nieprzerwanego ani bezbłędnego działania ani zgodności z każdym serwerem i konfiguracją sieci."],["Odpowiedzialność","W maksymalnym zakresie dozwolonym przez prawo nie odpowiadamy za szkody, utratę danych lub straty wynikające z korzystania z aplikacji lub przestojów serwerów, którymi zarządzasz lub od których zależysz."],["Zmiany","Te warunki mogą się zmieniać wraz z aktualizacjami aplikacji. Dalsze korzystanie po aktualizacji oznacza akceptację zaktualizowanych warunków."],["Kontakt","Pytania? Skontaktuj się z nami ze strony produktu w App Store."]]},
"nl":{"title":"Gebruiksvoorwaarden","updated":"Laatst bijgewerkt: september 2026","footer":"Gebruiksvoorwaarden","s":[["Acceptatie","Door SSH2VPN te downloaden en te gebruiken accepteer je deze Gebruiksvoorwaarden. Als je niet akkoord gaat, gebruik de app dan niet."],["Wat de app is","SSH2VPN is een client die je toestel via het SSH2-protocol en een standaard iOS VPN-profiel verbindt met een server die je zelf levert. Wij leveren, beheren of controleren geen servers. Jij bent verantwoordelijk voor het wettelijke recht op toegang tot je server en het naleven van de voorwaarden van je provider."],["Jouw verantwoordelijkheid","Je gebruikt SSH2VPN op eigen risico. Je gaat ermee akkoord de app alleen voor wettige doeleinden te gebruiken en alle toepasselijke wetten en de regels van elk netwerk of dienst waarmee je verbindt na te leven."],["Aankopen","De optionele upgrade Onbeperkt is een eenmalige in-app-aankoop die Apple verwerkt onder de standaardvoorwaarden van de App Store. Restituties worden door Apple afgehandeld volgens eigen beleid. Wordt een aankoop terugbetaald of ingetrokken, dan worden de Onbeperkt-functies verwijderd."],["Gratis laag en advertenties","De gratis laag geeft beperkte verbindingstijd, uit te breiden door optionele beloonde advertenties te bekijken. De beschikbaarheid van advertenties en gratis tijd is niet gegarandeerd en kan wijzigen."],["Geen garantie","De app wordt geleverd \"zoals het is\", zonder enige garantie. Wij garanderen geen ononderbroken of foutloze werking, en geen compatibiliteit met elke server of netwerkconfiguratie."],["Aansprakelijkheid","Voor zover de wet toestaat zijn wij niet aansprakelijk voor schade, dataverlies of verliezen voortkomend uit gebruik van de app of uitval van servers die je beheert of waarvan je afhankelijk bent."],["Wijzigingen","Deze voorwaarden kunnen veranderen bij app-updates. Doorgaan met gebruik na een update betekent dat je de bijgewerkte voorwaarden accepteert."],["Contact","Vragen? Neem contact op via de productpagina in de App Store."]]},
"vi":{"title":"Điều khoản Sử dụng","updated":"Cập nhật lần cuối: tháng 9 năm 2026","footer":"Điều khoản Sử dụng","s":[["Chấp nhận","Tải xuống và sử dụng SSH2VPN đồng nghĩa bạn chấp nhận các Điều khoản Sử dụng này. Nếu không đồng ý, đừng sử dụng ứng dụng."],["Ứng dụng là gì","SSH2VPN là ứng dụng khách kết nối thiết bị của bạn với máy chủ do chính bạn cung cấp, qua giao thức SSH2 trên hồ sơ VPN tiêu chuẩn của iOS. Chúng tôi không cung cấp, vận hành hay kiểm soát bất kỳ máy chủ nào. Bạn chịu trách nhiệm có quyền truy cập hợp pháp vào máy chủ của mình và tuân thủ điều khoản của nhà cung cấp."],["Trách nhiệm của bạn","Bạn sử dụng SSH2VPN tự chịu rủi ro. Bạn đồng ý chỉ dùng ứng dụng cho mục đích hợp pháp, tuân thủ mọi luật áp dụng và quy tắc của mọi mạng hoặc dịch vụ mà bạn kết nối tới."],["Mua hàng","Nâng cấp 'Không giới hạn' tùy chọn là giao dịch mua trong ứng dụng một lần do Apple xử lý theo điều khoản chuẩn của App Store. Hoàn tiền do Apple xử lý theo chính sách của họ. Nếu giao dịch bị hoàn tiền hoặc thu hồi, các tính năng Không giới hạn sẽ bị gỡ bỏ."],["Gói miễn phí và quảng cáo","Gói miễn phí cấp thời gian kết nối giới hạn, có thể gia hạn bằng cách xem quảng cáo có thưởng tùy chọn. Khả năng cung cấp quảng cáo và thời gian miễn phí không được đảm bảo và có thể thay đổi."],["Không bảo hành","Ứng dụng được cung cấp \"nguyên trạng\", không kèm bất kỳ bảo hành nào. Chúng tôi không đảm bảo hoạt động liên tục, không lỗi, hay tương thích với mọi máy chủ và cấu hình mạng."],["Trách nhiệm","Trong phạm vi pháp luật cho phép, chúng tôi không chịu trách nhiệm về thiệt hại, mất dữ liệu hay tổn thất phát sinh từ việc sử dụng ứng dụng hoặc downtime của các máy chủ bạn vận hành hoặc dựa vào."],["Thay đổi","Các điều khoản này có thể thay đổi cùng bản cập nhật ứng dụng. Tiếp tục sử dụng sau khi cập nhật nghĩa là bạn chấp nhận điều khoản đã cập nhật."],["Liên hệ","Có câu hỏi? Liên hệ qua trang sản phẩm trên App Store."]]},
"zh-Hans":"zh","pt-BR":"pt"
};

const NAMES = {en:"English",es:"Espa\u00f1ol",de:"Deutsch",fr:"Fran\u00e7ais",it:"Italiano",pt:"Portugu\u00eas",ja:"\u65e5\u672c\u8a9e",zh:"\u7b80\u4f53\u4e2d\u6587",ko:"\ud55c\uad6d\uc5b4",ar:"\u0627\u0644\u0639\u0631\u0628\u064a\u0629",hi:"\u0939\u093f\u0928\u094d\u0926\u0940",th:"\u0e44\u0e17\u0e22",tr:"T\u00fcrk\u00e7e",pl:"Polski",nl:"Nederlands",vi:"Ti\u1ebfng Vi\u1ec7t",ru:"\u0420\u0443\u0441\u0441\u043a\u0438\u0439"};

const ORDER = ["en","es","de","fr","it","pt","ja","zh","ko","ar","hi","th","tr","pl","nl","vi","ru"];
let cur = (window.APP_LANG || localStorage.getItem("ssh2vpn_lang") || navigator.language || "en");
if (!T[cur] || typeof T[cur] === "string") {
  const l = String(cur).toLowerCase();
  if (T[l] && typeof T[l] === "object") { cur = l; }
  else if (T[l.split("-")[0]] && typeof T[l.split("-")[0]] === "object") { cur = l.split("-")[0]; }
  else { cur = "en"; }
}
if (typeof T[cur] === "string") { cur = T[cur]; }
function apply(){
  const sel = document.getElementById("lang");
  if (sel && sel.value) { cur = sel.value; }

  const t = (typeof T[cur] === "object") ? T[cur] : T.en;
  document.getElementById("t-title").textContent = t.title;

  document.getElementById("t-footer").textContent = t.footer;

    return "<section><h2><span class='n'>"+(i+1)+"</span>"+x[0]+"</h2><p>"+x[1]+"</p></section>";
  }).join("");
}
(function init(){
  const sel = document.getElementById("lang");
  for (const k of ORDER) {
    if (typeof T[k] !== "object") continue;
    const o = document.createElement("option");
    o.value = k; o.textContent = (FLAGS[k]||"") + " " + NAMES[k];
    sel.appendChild(o);
  }
  sel.value = cur;
  apply();
})();
